# Composed by `fm sync` from the base's template and the tables
# each registered check owns; the gate keeps it matching. Edit inside
# the region at the end, which is the repository's own; an edit
# anywhere else is drift.
# The workspace's virtual root: never built, never published.
[project]
name = "livery"
version = "0.0.1"
description = "The livery ecosystem monorepo (virtual root)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
]

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[tool.uv.workspace]
# The members, explicitly: each is a package with a contract of its
# own, and this file is rendered from them, so a glob would only
# re-derive the same list while letting a stray directory join
# unnoticed. A non-python member (a cpp-conan package) is no uv project
# and never appears.
members = ["packages/extensions/basedpyright", "packages/extensions/mypy", "packages/extensions/pyrefly", "packages/extensions/ruff", "packages/extensions/ty", "packages/footman", "packages/forge", "packages/strongroom", "packages/toolroom", "packages/toolroom-bench", "packages/toolroom-store", "packages/workshop"]

[tool.uv.sources]
livery-extensions-basedpyright = { workspace = true }
livery-extensions-mypy = { workspace = true }
livery-extensions-pyrefly = { workspace = true }
livery-extensions-ruff = { workspace = true }
livery-extensions-ty = { workspace = true }
livery-footman = { workspace = true }
livery-forge = { workspace = true }
livery-strongroom = { workspace = true }
livery-toolroom = { workspace = true }
livery-toolroom-bench = { workspace = true }
livery-toolroom-store = { workspace = true }
livery-workshop = { workspace = true }

[dependency-groups]
# The docs toolchain, workshop-rendered so one extension release moves
# every project's generator together.
docs = [
    "zensical>=0.0.50",
    "mkdocstrings-python>=1.11",
]
dev = [
    # uv itself, unconstrained so it tracks latest; the lockfile still
    # resolves it to one exact version (footman's lockfile-churn lesson).
    "uv",
    # Typed tool handles tasks.py runs through.
    # The workspace members, so root tests import them; an entry may
    # carry extras the dev loop needs.
    "livery-extensions-basedpyright",
    "livery-extensions-mypy",
    "livery-extensions-pyrefly",
    "livery-extensions-ruff",
    "livery-extensions-ty",
    "livery-footman[test]",
    "livery-forge[github-secrets]",
    "livery-strongroom",
    "livery-toolroom[test]",
    "livery-toolroom-bench",
    "livery-toolroom-store",
    "livery-workshop[dev]",
    # Every contract extension that is not already a member above, so a
    # rendered tasks.py can always import its plugins.
    # What the registered checks need in the venv: each line is a
    # check record's contribution to the `python.dev-group` slot, so a
    # check an extension withdraws takes its line with it, and the record
    # is where its floor and its reason live.
    "pytest>=8.0",
    "pytest-cov>=5",
    "coverage[toml]>=7.13",
    "pytest-xdist>=3.6",
    "mypy>=1.14",
]

[tool.footman]
# Every verb brings the environment current from the lock itself, and
# `fm sync` rewrites this file before it syncs: the runner's
# handoff enters the environment as it is, so a member deleted from
# packages/ never fails the command that removes it from here.
uv-handoff = "enter"
# Task names in --list/--tree/--help (and --json rows) link into the
# published task reference; the alias tree there redirects each task
# to its page in the owning package's section.
docs-url = "https://docs.willem.net/livery/tasks/{slug}/"

[tool.footman.notes]
# Every misuse note fails the task at its boundary: a raw spawn or
# an ambient write is fixed or deliberately classified, never
# ambient. Loosen a single kind here with a reason, never the star.
"*" = "error"

[tool.coverage.run]
# The tests measure, and every process they start, every
# fm child a test spawns included: inside CI the test
# runner arms COVERAGE_PROCESS_START in pytest's environment, the .pth
# coverage installs starts the meter in every python under it, and the
# patch cascades through the workers. The gate's own driver is never
# metered, so a line counts only when a test reached it. Parallel
# data files merge per leg, then across legs in the aggregating
# gate job.
patch = ["subprocess"]
parallel = true
relative_files = true
# Branches as well as statements: a conditional's untaken arm is
# uncovered, where line coverage shows the conditional as covered
# once its line ran. The floors judge the combined figure.
branch = true
source = ["livery"]
# The C tracer, not sys.monitoring: the sysmon core records a line
# under the first context that reaches it and never again, and the
# check legs split one run's data per suite by context, which needs
# every context complete.
core = "ctrace"

[tool.coverage.paths]
# One identity for a file whichever separator wrote it, so Windows
# and POSIX legs combine as one file set.
packages = ["packages/", "packages\\"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
# Test modules are named by their path (`--import-mode=importlib`), so
# two packages may both have a tests/test_lifecycle.py. That leaves the
# tests directories off sys.path, so they go on pythonpath for the
# helper modules, which carry their package's name and so never clash.
pythonpath = ["packages/extensions/basedpyright/tests", "packages/extensions/mypy/tests", "packages/extensions/pyrefly/tests", "packages/extensions/ruff/tests", "packages/extensions/ty/tests", "packages/footman/tests", "packages/forge/tests", "packages/strongroom/tests", "packages/toolroom/tests", "packages/toolroom-bench/tests", "packages/toolroom-store/tests", "packages/workshop/tests", "tests"]
# `-n auto` fans the suite across cores; `worksteal` because durations
# are uneven (footman measured it; the choice carries until we measure
# here).
addopts = "-q -n auto --dist=worksteal --import-mode=importlib"

# The repository's own tables: whole tables and array-of-table entries
# (a `[tool.x]` of your own), never a key inside a table the render
# wrote; a tool with an `extend-` spelling takes that.
# -- workshop: region tables, yours to edit; the render keeps it --
# -- workshop: end tables --
