# Composed by `fm sync` from the base's template and the tables
# each registered check owns; the gate keeps it matching. Edit inside
# the region at the end, which is the repository's own; an edit
# anywhere else is drift.
# The workspace's virtual root: never built, never published.
[project]
name = "livery"
version = "0.0.1"
description = "The livery ecosystem monorepo (virtual root)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
]

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[tool.uv.workspace]
# The members, explicitly: each is a package with a contract of its
# own, and this file is rendered from them, so a glob would only
# re-derive the same list while letting a stray directory join
# unnoticed. A non-python member (a cpp-conan package) is no uv project
# and never appears.
members = ["packages/extensions/basedpyright", "packages/extensions/changelog", "packages/extensions/clang-format", "packages/extensions/clang-tidy", "packages/extensions/mypy", "packages/extensions/pyrefly", "packages/extensions/pytest", "packages/extensions/ruff", "packages/extensions/ty", "packages/footman", "packages/forge", "packages/strongroom", "packages/toolroom", "packages/toolroom-bench", "packages/toolroom-store", "packages/workshop"]

[tool.uv.sources]
livery-extensions-basedpyright = { workspace = true }
livery-extensions-changelog = { workspace = true }
livery-extensions-clang-format = { workspace = true }
livery-extensions-clang-tidy = { workspace = true }
livery-extensions-mypy = { workspace = true }
livery-extensions-pyrefly = { workspace = true }
livery-extensions-pytest = { workspace = true }
livery-extensions-ruff = { workspace = true }
livery-extensions-ty = { workspace = true }
livery-footman = { workspace = true }
livery-forge = { workspace = true }
livery-strongroom = { workspace = true }
livery-toolroom = { workspace = true }
livery-toolroom-bench = { workspace = true }
livery-toolroom-store = { workspace = true }
livery-workshop = { workspace = true }

[dependency-groups]
# The docs toolchain, workshop-rendered so one extension release moves
# every project's generator together.
docs = [
    "zensical>=0.0.50",
    "mkdocstrings-python>=1.11",
]
dev = [
    # uv itself, unconstrained so it tracks latest; the lockfile still
    # resolves it to one exact version (footman's lockfile-churn lesson).
    "uv",
    # Typed tool handles tasks.py runs through.
    # The workspace members, so root tests import them; an entry may
    # carry extras the dev loop needs.
    "livery-extensions-basedpyright",
    "livery-extensions-changelog",
    "livery-extensions-clang-format",
    "livery-extensions-clang-tidy",
    "livery-extensions-mypy",
    "livery-extensions-pyrefly",
    "livery-extensions-pytest",
    "livery-extensions-ruff",
    "livery-extensions-ty",
    "livery-footman[test]",
    "livery-forge[github-secrets]",
    "livery-strongroom",
    "livery-toolroom[test]",
    "livery-toolroom-bench",
    "livery-toolroom-store",
    "livery-workshop[dev]",
    # Every contract extension that is not already a member above, so a
    # rendered tasks.py can always import its plugins.
    # What the registered checks need in the venv: each line is a
    # check record's contribution to the `python.dev-group` slot, so a
    # check an extension withdraws takes its line with it, and the record
    # is where its floor and its reason live.
    "mypy>=1.14",
    "pytest>=9.0",
    "pytest-cov>=5",
    "coverage>=7.13",
    "pytest-xdist>=3.6",
]

[tool.footman]
# Every verb brings the environment current from the lock itself, and
# `fm sync` rewrites this file before it syncs: the runner's
# handoff enters the environment as it is, so a member deleted from
# packages/ never fails the command that removes it from here.
uv-handoff = "enter"

[tool.footman.notes]
# Every misuse note fails the task at its boundary: a raw spawn or
# an ambient write is fixed or deliberately classified, never
# ambient. Loosen a single kind here with a reason, never the star.
"*" = "error"

# The repository's own tables: whole tables and array-of-table entries
# (a `[tool.x]` of your own), never a key inside a table the render
# wrote; a tool with an `extend-` spelling takes that.
# -- workshop: region tables, yours to edit; the render keeps it --
# -- workshop: end tables --
