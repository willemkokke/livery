# Seeded from the package-python seeds at
# birth; this file is the workspace's own. Edit it directly:
# nothing rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-git"
version = "0.2.0"
description = "Git access for the livery ecosystem: every call a function of the repository's root, through the tool store's pinned git."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    # The pinned git handle every network call and every porcelain
    # call runs through; 0.11.0 is the floor the workshop already
    # carries for the same namespace.
    "livery-toolroom>=0.11.0",
    # The in-process reads and local writes: refs, objects and config
    # read as files, a root commit written as objects, no process. A
    # pure-Python wheel exists for every platform; 1.2.17 is the first
    # version this package was proved against.
    "dulwich>=1.2.17",
]

[project.optional-dependencies]
# The suite drives the plugin, the one module that reaches for the
# runner. Never a runtime dependency: the plugin loads only through
# footman's own plugin(), so footman is present by construction.
test = ["livery-footman>=0.60.0"]

[project.entry-points."footman.tasks"]
# The plugin (livery.git._plugin): the environment every git spawn
# under footman runs with. The module imports footman, which is not a
# dependency: the only loader is footman's own plugin().
"livery.git" = "livery.git._plugin"

# A project that depends on livery-git directly gets the plugin
# through footman's project rung.
[project.entry-points."footman.builtin"]
"livery.git" = "livery.git._plugin"

[project.urls]
Repository = "https://github.com/willemkokke/livery"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is livery.git and
# there is no livery/__init__.py anywhere in this repository.
module-name = "livery.git"
