# Seeded from the python-library template at
# birth; this file is the workspace's own. Edit it directly:
# nothing rewrites it.
# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-toolroom"
description = "Typed surfaces for command-line tools, generated from the tools themselves."
dev-extras = ["test"]

[docs]
generators = ["toolroom.docs"]

# The stubs the tool pages point at, rendered by the generator, which
# the API reference's handler reads beside the package's sources.
[phases.docs.mkdocstrings]
paths = ["docs/_generated/stubs"]

[release]
# The line continues past the origin's last index release (0.6.1);
# the shim and this package release identically, under one number.
baseline = "0.6.2"

[coverage]
# The coverage high-water mark the gate enforces, just under what the
# CI union measures; raise it as the suite grows, lower it only
# deliberately.
floor = 95

[owners]
users = ["willemkokke"]
teams = []
approvals = 0
