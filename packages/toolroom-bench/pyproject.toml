# Seeded from the template channel (package-python kind) at
# birth; this file is the workspace's own. Edit it directly:
# the template never rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-toolroom-bench"
version = "0.0.0"
description = "The bench where toolroom's typed tool handles are made and refreshed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# The bench runs under footman and writes the stubs of
# livery.toolroom.tools: both are runtime dependencies, and a consumer
# of the handles never installs the bench.
dependencies = [
    "livery-footman>=0.53.0",
    "livery-toolroom>=0.7.0",
]

[project.optional-dependencies]
test = [
    # The driver suite interrogates mkdocs structurally (the click
    # ladder) and reads its version; without a venv copy the finder
    # meets whatever the machine carries, which the suite's python
    # cannot introspect.
    "mkdocs>=1.6",
]

[project.entry-points."footman.tasks"]
"livery.toolroom.bench" = "livery.toolroom.bench"

[project.urls]
Repository = "https://github.com/willemkokke/livery"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is livery.toolroom_bench and
# there is no livery/__init__.py anywhere in this repository.
# PEP 420 namespaces: livery and livery.toolroom carry no __init__.py.
module-name = "livery.toolroom.bench"
namespace = true

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# The imported sources predate the workspace's pydocstyle rule;
# their docstring conformance is a tracked content pass, not a
# cut-time rewrite. Retired by that pass.
"src/**" = ["D105", "D102", "D107", "D205", "D301", "D415"]
"tests/**" = ["D1", "D205", "D301", "D415", "E501"]
