# Seeded from the template channel (package-python kind) at
# birth; this file is the workspace's own. Edit it directly:
# the template never rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-toolroom-bench"
version = "0.2.0"
description = "The bench where toolroom's typed tool handles are made and refreshed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# The bench runs under footman, writes the stubs of
# livery.toolroom.tools, and reads and writes the tool records through
# the store: all three are runtime dependencies, and a consumer of the
# handles never installs the bench.
dependencies = [
    "livery-footman>=0.59.0",
    "livery-toolroom>=0.11.0",
    "livery-toolroom-store>=0.3.0",
]

[project.optional-dependencies]
test = [
    # The driver suite interrogates mkdocs structurally (the click
    # ladder) and reads its version; without a venv copy the finder
    # meets whatever the machine carries, which the suite's python
    # cannot introspect.
    "mkdocs>=1.6",
    # The suite drives the store's records, which strongroom names.
    "livery-strongroom>=0.4.0",
]

[project.entry-points."footman.tasks"]
"livery.toolroom.bench" = "livery.toolroom.bench:tasks"

# A project that depends on the bench directly gets the tools verbs
# through footman's project rung.
[project.entry-points."footman.builtin"]
"livery.toolroom.bench" = "livery.toolroom.bench:tasks"

[project.entry-points.pytest11]
# Every test session with the bench installed runs apart from the
# machine's provisioned tools and store; a directory the environment
# already points away is left alone.
livery-toolroom-bench-isolation = "livery.toolroom.bench._pytest_isolation"

[project.urls]
Repository = "https://github.com/willemkokke/livery"

[tool.uv.build-backend]
# The importable package is livery.toolroom.bench, its entry module the
# root's __init__.py; livery and livery.toolroom are PEP 420 namespaces
# with no __init__.py.
module-name = "livery.toolroom.bench"
