# Seeded from the template channel (package-python kind) at
# birth; this file is the workspace's own. Edit it directly:
# the template never rewrites it.
# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
type = "python"
name = "livery-toolroom-bench"

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.7.0"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.53.0"

[[depends]]
path = "packages/toolroom-store"
kind = "runtime"
floor = "0.0.0"

[docs]
# The index of the tool records, built into docs/_generated/index and
# served by the site's deploy as static files.
generators = ["tools.index.build"]

[qa]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately.
# The machinery's suite as it arrived from toolroom, whose floor is 85.
coverage-floor = 85

# The six-host verification point: every downloaded tool installs,
# runs and reads on the host it was built for, fortnightly. One
# runner per host key; the gate keeps its three.
[[ci.point]]
name = "tool-hosts"
task = "tools.verify-host"
every = "2w"
runners = [
    "ubuntu-latest",
    "ubuntu-24.04-arm",
    "macos-latest",
    "macos-15-intel",
    "windows-latest",
    "windows-11-arm",
]
