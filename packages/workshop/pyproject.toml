[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-workshop"
version = "0.10.0"
description = "The livery ecosystem's devkit: the task surface, extensions, templates, and content."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "livery-forge>=0.7.0",
    # The floors on deps the dev toolchain also carries align with
    # the lock: the release train's floor leg shares one venv with
    # the locked toolchain, so a floor below the toolchain's pin is
    # a claim the leg cannot test (its movement guard refuses the
    # silent un-starving). 0.52.2 is the first livery-footman: the
    # workshop imports livery.footman directly, never the shim.
    "livery-footman>=0.60.0",
    # 0.7.0 is the first livery-toolroom with the livery.toolroom
    # namespace, whose tools module the workshop imports; the release
    # act's lowest-direct leg installs the floor and proves it.
    "livery-toolroom>=0.11.0",
    # Every git call the workshop makes goes through livery.git.
    "livery-git>=0.2.0",
    # The tool records, the catalogue and the lock: what `fm tools.*`
    # resolves against.
    "livery-toolroom-store>=0.4.0",
    # The digest grammar and the registry of algorithms that may name
    # bytes. Already installed through the tool store's own edge; the
    # floor is the one that edge carries, since raising one is a
    # decision and the release's lowest-direct leg proves it.
    "livery-strongroom>=0.4.0",
    # The fragment engine's renderer: one compiled template per
    # fragment content, over the subset the engine declares.
    "minijinja>=2.24",
    # The coverage extension rides in this wheel, and highlights each
    # file's source on its pages with Pygments, imported when the pages
    # are drawn. The floor is the lock's.
    "pygments>=2.21.0",
]

[project.optional-dependencies]
# What this package's own dev loop needs beyond its dependencies: its
# tests parse the emitted CI files as YAML, with the stubs so mypy stays
# strict, and the coverage pages' Pygments calls are typed by its stubs. The pyyaml floor is the oldest release whose wheels cover
# every Python this package supports; 6.0.0's sdist no longer builds
# under a current Cython. The workspace's dev group installs the member
# as `livery-workshop[dev]`.
dev = ["pyyaml>=6.0.3", "types-pyyaml", "types-pygments"]
# The mkdocstrings extension rides in this wheel, and its reference
# check reads the sources with griffe, which griffelib ships, imported
# inside the function that reads them. A workspace that lists
# mkdocstrings gets griffe through mkdocstrings-python, the extension's
# line in the docs dependency group, so the wheel's runtime needs none.
# This package's suite runs the check, so the release's isolated legs
# install the wheel with this extra. The floor is the lock's.
test = ["griffelib>=2.2.0"]

[project.entry-points."footman.tasks"]
"livery.workshop" = "livery.workshop._mount"
# The docs extension, an extension inside this wheel with a surface of its own.
"livery.extensions.docs" = "livery.extensions.docs._tasks"
# The nanobind extension's verb, the one the release's wheels job runs.
"livery.extensions.nanobind" = "livery.extensions.nanobind._tasks"
# The coverage extension's verbs: the leg's entry, the union, and the
# floors and marks a person runs.
"livery.extensions.coverage" = "livery.extensions.coverage._tasks"

# The workshop extensions this wheel ships, by the name a workspace
# lists: each maps to the package beside its extension.toml, which the
# mount and the contract judge read without importing the extension.
[project.entry-points."workshop.extensions"]
conan = "livery.extensions.conan"
coverage = "livery.extensions.coverage"
cpp = "livery.extensions.cpp"
docs = "livery.extensions.docs"
mkdocstrings = "livery.extensions.mkdocstrings"
nanobind = "livery.extensions.nanobind"
python = "livery.extensions.python"

# The devkit advertisement: "meant to be mounted as built-in tasks".
# `fm self.add livery-workshop` records the name; whether it mounts
# stays the machine owner's call through builtins.discovery_mode.
[project.entry-points."footman.builtin"]
"livery.workshop" = "livery.workshop._mount"

# The runner's sweep: what the workshop leaves in the data directory
# is the workshop's to bound, run by `fm janitor` and the
# daily collector child.
[project.entry-points."footman.sweepers"]
"livery.workshop" = "livery.workshop._sweep:sweep"

# The doctors: the forge's identity, grants and owners; the host's
# compilers, served tools and unlisted extensions. `fm doctor` runs them
# after footman's own.
[project.entry-points."footman.doctors"]
"livery.workshop.forge" = "livery.workshop._doctor:forge"
"livery.workshop.host" = "livery.workshop._doctor:host"
"livery.workshop.uv-cache" = "livery.workshop._doctor:uv_cache"
"livery.workshop.ssh" = "livery.workshop._doctor:ssh"

# The workshop's pytest plugins: every pytest this venv starts carries
# them.
[project.entry-points.pytest11]
# A package's documentation examples, the files under docs/examples/,
# collected as tests when pytest is pointed at them.
livery-workshop-examples = "livery.workshop._pytest_examples"
# Every test runs apart from the machine's live runner state, and
# the global task registry and what an extension mount writes are
# guarded per test.
livery-workshop-isolation = "livery.workshop._pytest_isolation"
# A test declares the CI points it runs at; the point in the job
# runner's environment selects.
livery-workshop-points = "livery.workshop._pytest_points"
livery-workshop-speed = "livery.workshop._pytest_speed"
livery-workshop-console = "livery.workshop._pytest_console"
# A helper module in a package's tests directory carries the package's
# name; the session refuses one that does not, before any test runs.
livery-workshop-layout = "livery.workshop._pytest_layout"

[project.urls]
Repository = "https://github.com/willemkokke/livery"

[tool.uv.build-backend]
# The wheel ships the base, livery.workshop, whose entry module is its
# __init__.py, and extensions with no public names under the PEP 420
# namespace livery. Nothing imports an extension but the workshop's
# mount and an extension that requires it. The flag lets uv ship a root
# with no __init__.py.
module-name = [
    "livery.workshop",
    "livery.extensions.conan",
    "livery.extensions.coverage",
    "livery.extensions.cpp",
    "livery.extensions.docs",
    "livery.extensions.mkdocstrings",
    "livery.extensions.nanobind",
    "livery.extensions.python",
]
namespace = true
