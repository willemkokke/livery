# Generated by the workshop from workshop.toml; the gate keeps
# it matching. Edit the contract (or the emitters) and run
# `fm sync`; an edit here is drift.
# The gate, the merge point, the nightly and the train, GitLab-shaped,
# generated by the workshop. One pipeline definition: workflow rules
# admit FORGE_WORKFLOW-routed pipelines (a dispatch, the clock), merge
# requests and main, and every pipeline is named after its workflow
# file, so a run reads on every forge the same way and a dispatched
# gate is told from a dispatched wave. Every job sources the entry
# script in its own shell, then calls the runner bare. The clock
# itself is a pipeline schedule, a project setting the governance
# reconcile creates, never a line here. GitLab CI variables arrive as
# process environment, the cascade's highest rung already: declare
# PYTHON_PUBLISH_INDEX, PYTHON_REGISTRY_URL, FORGE_TOKEN,
# UV_PUBLISH_TOKEN and GITLAB_PUSH_TOKEN (a project access token with
# write_repository: the job token cannot push, and the state store
# and the receipt tags are pushes) as CI
# variables, masked where their values allow it.
workflow:
  name: $FORGE_WORKFLOW
  rules:
    - if: $FORGE_WORKFLOW
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        FORGE_WORKFLOW: ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        FORGE_WORKFLOW: ci.yml

stages: [check, release]

# The check legs: each runs the gate, and its row rides its per-run ref on
# the state store, in one write with the files its other entries left, for
# the gate job. The scoped gate measures from the proved tree nearest the
# checkout's, an earlier push's merge rebuilt from its two commits among
# them, or from the merge base with the pull request's base branch; each
# needs history a shallow clone lacks.
check:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$FORGE_WORKFLOW == "ci.yml"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git"
    - source setup.sh
    - fm ci.run --point=gate --job=check --os="ubuntu-latest" --python="3.13"

# The one required context. Branch protection points here, so the matrix
# can grow or shrink without touching repository settings. Its entries run
# the judges the extensions add, collect the run's timing rows, ask the
# forge for the jobs it needs, and stamp the tree a green run proved; a
# red run is judged too. The stamp composes a narrowed run with the record
# of the tree its legs measured from, and names the two commits a merge
# checkout joined. On a push to main the same job then dispatches the
# release wave, runs what the extensions add to the merge point, and runs
# the janitor.
gate:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  needs: [check]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
      if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: always
      if: '$FORGE_WORKFLOW == "ci.yml"'
    - when: always
      if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git"
    - source setup.sh
    - fm ci.run --point=gate --job=gate

# The repository settings reconciled when the merge changed a contract or
# the owners file. The commit's own file list decides whether anything is
# governed; a depth of one would read a squash as a root.
govern:
  stage: release
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  variables:
    GIT_DEPTH: "2"
    FORGE_ADMIN_TOKEN: $FORGE_ADMIN_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - source setup.sh
    - fm ci.run --point=merge --job=govern

# A verification checks the tree out at a release tag. A pull request a
# scheduled task opens with the job token starts no workflow, so the
# repository's token carries the nightly where there is one. The job's
# profile trace rides the state store at its end, which needs the write
# grant as the check legs' puts do.
nightly:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FORGE_WORKFLOW == "nightly.yml"'
    - if: '$FORGE_WORKFLOW == "nightly.yml"'
  script:
    - git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git"
    - source setup.sh
    - fm ci.run --point=nightly --job=nightly --python="3.13"

# Every platform's wheels, built before the wave: the matrix feeds the
# publish job through artifacts, so one release ships the complete set.
wheels:
  stage: release
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$FORGE_WORKFLOW == "release.yml"'
  script:
    - git checkout --quiet "$ref"
    - source setup.sh
    - fm release.driver --workshop="$workshop"
    - fm ci.run --point=release --job=wheels
  artifacts:
    paths: ["packages/*/dist/*", "packages/*/*/dist/*"]

# The wave: publish the ref, cut the receipt tags after the index confirms
# each member. The receipt push carries the repository's token where there
# is one: the job token may not push a ref whose commit carries a workflow
# file that differs from the tip's.
publish:
  stage: release
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  needs: [wheels]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$FORGE_WORKFLOW == "release.yml"'
  script:
    - git checkout --quiet "$ref"
    - git fetch --tags
    - git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git"
    - source setup.sh
    - fm release.driver --workshop="$workshop"
    - fm ci.run --point=release --job=publish

