# Generated by the workshop from workshop.toml; the gate keeps
# it matching. Edit the contract (or the emitters) and run
# `fm sync`; an edit here is drift.
name: release

# The train: a workflow.release PR merges, this publishes its squash, and
# the receipt tags are cut only after the index confirms each member. A
# tag is a receipt, never a trigger: the merge point's dispatch job starts
# the wave at the release squash, and a hand dispatch with --ref is the
# recovery entry when a publish died mid-wave; --workshop names a released
# driver for a wave whose own workshop was the fault.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: the release squash to publish
        required: true
      workshop:
        description: a released livery-workshop version to drive the wave; empty runs the squash's own
        required: false
        default: ""

jobs:
  # Every platform's wheels, built before the wave: the matrix feeds the
  # publish job through artifacts, so one release ships the complete set.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Pin the driver
        run: fm release.driver --workshop="${{ inputs.workshop }}"
      - name: Wheels
        run: fm ci.run --point=release --job=wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: |
            packages/*/dist/*
            packages/*/*/dist/*
          if-no-files-found: ignore
  # The wave: publish the ref, cut the receipt tags after the index
  # confirms each member. The receipt push carries the repository's token
  # where there is one: the job token may not push a ref whose commit
  # carries a workflow file that differs from the tip's.
  publish:
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.FORGE_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels*
          path: packages
          merge-multiple: true
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Pin the driver
        run: fm release.driver --workshop="${{ inputs.workshop }}"
      - name: Publish the wave
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN || secrets.GITHUB_TOKEN }}
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: fm ci.run --point=release --job=publish
