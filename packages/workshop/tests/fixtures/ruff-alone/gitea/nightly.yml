# Generated by the workshop from workshop.toml; the gate keeps
# it matching. Edit the contract (or the emitters) and run
# `fm sync`; an edit here is drift.
name: nightly

# The nightly point: the clock and a dispatch entry, one call per Python.
# What runs is the workshop's builtin schedule plus [[ci.schedule]] in
# workshop.toml, and the tests that declare the nightly point are selected
# in.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: the scheduled tasks to run, comma-separated; empty runs the whole schedule
        required: false
        default: ""

jobs:
  # A verification checks the tree out at a release tag. A pull request a
  # scheduled task opens with the job token starts no workflow, so the
  # repository's token carries the nightly where there is one. The job's
  # profile trace rides the state store at its end, which needs the write
  # grant as the check legs' puts do.
  nightly:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Enter the workspace
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: bash setup.sh github
      - name: Nightly
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: >-
          fm ci.run --point=nightly --job=nightly
          --python="${{ matrix.python }}"
