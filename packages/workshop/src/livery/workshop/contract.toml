# The base's contract keys: every key of workshop.toml the base reads, at
# the root and in a package's contract, and every key of extension.toml.
# An extension declares the keys it owns the same way, in the [contract]
# tables of its own extension.toml; the composed JSON Schema under
# .workshop/schema/ holds them all, and the contract judge reads it.
#
# A key is a table with its types, and its values and doc where it has
# them. "*" is a key the author names, "name[]" a list's entries. A key
# named types, values or doc is a table like any other key; a list or a
# string under those names is the key's own declaration.
#
# [for.<target>] in an extension.toml takes the checks, ci and
# contributions keys of its top level again: the composer repeats them
# under for.*, so they are written once, below.

# workshop.toml at a workspace's root.

