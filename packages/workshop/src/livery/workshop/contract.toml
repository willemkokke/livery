# The base's contract keys: every key of workshop.toml the base reads, at
# the root and in a package's contract, and every key of extension.toml.
# An extension declares the keys it owns the same way, in the [contract]
# tables of its own extension.toml; the composed JSON Schema under
# .workshop/schema/ holds them all, and the contract judge reads it.
#
# A key is a table with its types, and its values and doc where it has
# them. "*" is a key the author names, "name[]" a list's entries. A key
# named types, values or doc is a table like any other key; a list or a
# string under those names is the key's own declaration.
#
# [for.<target>] in an extension.toml takes every table of its top level
# again but [extension], [for] and [contract]: the composer repeats them
# under for.*, so they are written once, below.
#
# The base's phases are declared at the end, under [phases.<phase>], its
# queries under [queries.<name>], the tools it runs under [toolroom] and
# its templates under [templates.<name>], each in the grammar an
# extension declares one in under the same table of its extension.toml.

# workshop.toml at a workspace's root.

[contract.root.ci]
types = ["table"]
doc = "how the CI runs: its runners, its Pythons, its scheduled tasks, its traces and its merge policy"

[contract.root.ci.affected-legs]
types = ["bool"]
doc = "whether a pull request's check legs run only the packages its change can reach, the others' results read from the coverage store; false when absent"

[contract.root.ci.automerge]
types = ["bool"]
doc = "whether fm submit arms auto-merge when neither --armed nor WORKSHOP_AUTOMERGE decides; false when absent"

[contract.root.ci.profile]
types = ["bool"]
doc = "whether every CI job keeps a trace of what it ran; true when absent"

[contract.root.ci.profile-into]
types = ["str"]
doc = "where an assembled trace lands, relative to the root unless absolute; .workshop/profiles when absent"

[contract.root.ci.profile-keep]
types = ["int"]
doc = "how many assembled traces stay where they land, 0 keeping every one; 50 when absent"

[contract.root.ci.profile-window]
types = ["int"]
doc = "how many runs' traces the trace refs keep, 0 keeping none; 100 when absent"

[contract.root.ci.pull-request-runners]
types = ["strs"]
doc = "the runner labels a pull request's check legs fan out to, each one [ci] runners names; every runner when absent, and a merge or a dispatch always runs them all"

[contract.root.ci.python-versions]
types = ["strs"]
doc = "the Pythons the CI runs, such as 3.14, or 3.14t for a free-threaded build; the root project's floor and the newest supported minor when absent, the gate running the newest alone"

[contract.root.ci.required-context]
types = ["str"]
doc = "the check branch protection requires before a merge; gate when absent, which is the verdict job's name"

[contract.root.ci.runners]
types = ["strs"]
doc = "the runner labels the check legs fan out to, the first one running every single-runner job; ubuntu-latest when absent"

# A scheduled entry; `every` takes the cadences
# livery.workshop._points.CADENCES names, which a test holds equal.
[contract.root.ci.schedule]
types = ["list"]
doc = "the tasks the workspace adds to its points' jobs, after the builtin ones; none when absent"

[contract.root.ci."schedule[]"]
types = ["table"]
doc = "one scheduled task: the point and job it runs in, its arguments and its cadence"

[contract.root.ci."schedule[]".args]
types = ["strs"]
doc = "the task's arguments, each formatted with the run's facts: {display}, {label}, {os}, {python}, and a dispatch input such as {ref}; none when absent"

[contract.root.ci."schedule[]".every]
types = ["str"]
doc = "how often the task runs: 1w on Mondays, 2w on the Mondays of even ISO weeks; every run of the point when absent"
values = ["1w", "2w"]

[contract.root.ci."schedule[]".job]
types = ["str"]
doc = "the job of the point the task runs in; the job named after the point when absent"

[contract.root.ci."schedule[]".once]
types = ["bool"]
doc = "whether the task runs on a matrix job's first leg alone, the first runner and the first Python of the nightly; every leg when absent"

[contract.root.ci."schedule[]".point]
types = ["str"]
doc = "the point the task runs at: gate, merge, nightly, release, or a point a package contributes"

[contract.root.ci."schedule[]".task]
types = ["str"]
doc = "the task to run, by the dotted name the workspace mounts it under"

[contract.root.ci.speed-marks]
types = ["bool"]
doc = "whether the gate judges each leg's test time against its recorded mark, a second slow run in a row going red; false when absent"

[contract.root.ci.windows-temp]
types = ["str"]
doc = "where a Windows check leg keeps its temporary files: runner on the runner's working drive, system on the system's; runner on GitHub and system elsewhere when absent"
values = ["runner", "system"]

[contract.root.forge]
types = ["table"]
doc = "where the repository lives: the forge's kind, its owner and its server"

[contract.root.forge.kind]
types = ["str"]
doc = "the forge that hosts the repository: github, gitea or gitlab"
values = ["github", "gitea", "gitlab"]

[contract.root.forge.owner]
types = ["str"]
doc = "the user or organisation that owns the repository on the forge"

[contract.root.forge.url]
types = ["str"]
doc = "the forge server's web address; github.com on GitHub, and GITEA_URL or GITLAB_URL from the environment otherwise, when absent"

[contract.root.issues]
types = ["table"]
doc = "the issue verbs' policy"

[contract.root.issues.assignees]
types = ["int"]
doc = "how many people one issue may have assigned at once; 1 when absent"

[contract.root.owners]
types = ["table"]
doc = "who owns the workspace's governance: the root contract and the code owners file"

[contract.root.owners.approvals]
types = ["int"]
doc = "how many of the owners' approvals a merge needs; 0 when absent, so review goes to them without being required"

[contract.root.owners.teams]
types = ["strs"]
doc = "the forge teams, under the forge's owner, that own the root contract and the code owners file"

[contract.root.owners.users]
types = ["strs"]
doc = "the forge users who own the root contract and the code owners file"

# The package registries: an address per kind, or a table naming the
# read and publish addresses; an index with an ecosystem default may
# also name its prerelease policy. The kinds are the env cascade's, in
# livery.workshop._registries, and a test holds them equal.
[contract.root.phases]
types = ["table"]
doc = "the steps the workspace turns on, by phase and step"

[contract.root.phases."*"]
types = ["table"]
doc = "a phase, by its name, to the steps the workspace turns on in it"

[contract.root.phases."*"."*"]
types = ["table"]
doc = "a step the workspace turns on, by its name in its phase"

[contract.root.phases."*"."*".enabled]
types = ["bool"]
doc = "whether the step registers, for a step its extension declares enabled = false; false when absent"

[contract.root.registries]
types = ["table"]
doc = "where each kind of artifact is read and published: conan, container, python; an environment variable for a kind wins over its entry here"

[contract.root.registries.conan]
types = ["str", "table"]
doc = "the conan remote: its address, or a table naming it; the forge's conan registry, else its releases, when absent"

[contract.root.registries.conan.publish]
types = ["str"]
doc = "the conan remote's address when url is absent; conan reads and uploads at one address"

[contract.root.registries.conan.url]
types = ["str"]
doc = "the conan remote's address: a URL or a local folder"

[contract.root.registries.container]
types = ["str", "table"]
doc = "the container registry the site's image pushes to: its reference prefix, or a table naming it; ghcr.io/<owner> on GitHub and the forge's own on Gitea when absent"

[contract.root.registries.container.publish]
types = ["str"]
doc = "the registry's reference prefix when url is absent; a container registry reads and pushes at one address"

[contract.root.registries.container.url]
types = ["str"]
doc = "the registry's reference prefix, such as ghcr.io/<owner>"

[contract.root.registries.python]
types = ["str", "table"]
doc = "the python index: its read address, or a table with its read and upload addresses; the forge's own on Gitea, else pypi.org, when absent"

[contract.root.registries.python.prerelease]
types = ["str"]
values = ["disallow", "allow", "if-necessary", "explicit", "if-necessary-or-explicit"]
doc = "uv's prerelease policy for the workspace's resolution; uv's own when absent"

[contract.root.registries.python.publish]
types = ["str"]
doc = "where the release uploads its wheels; required for a declared index, or the release refuses"

[contract.root.registries.python.url]
types = ["str"]
doc = "the index the workspace resolves from first, which the release also probes; the publish address when absent"

[contract.root.release]
types = ["table"]
doc = "the release train's defaults for every member"

[contract.root.release.prove]
types = ["strs"]
values = ["floor", "latest", "head"]
doc = "the resolutions a release tests each member at, each at most once: floor at the lowest versions its requirements allow, latest at the newest, head at the workspace lock's; a member's own list wins; floor and latest when absent"

[contract.root.workspace]
types = ["table"]
doc = "the workspace's identity and stack: its name, description, namespace, authors, extensions and hosts"

[contract.root.workspace.authors]
types = ["list"]
doc = "the project's authors; the first is the one its project file and licences name"

[contract.root.workspace."authors[]"]
types = ["table"]
doc = "one author: a name and an email"

[contract.root.workspace."authors[]".email]
types = ["str"]
doc = "the author's email; without it the root project file lists no authors"

[contract.root.workspace."authors[]".name]
types = ["str"]
doc = "the author's name; '<project> authors' when absent"

[contract.root.workspace.copyright-year]
types = ["str"]
doc = "the year the licences' copyright lines name"

[contract.root.workspace.description]
types = ["str"]
doc = "the project's one-line description, for its project file and README; 'The <name> monorepo (virtual root).' when absent"

# Read raw by a pre_tasks hook on every command, so an edit links the
# next one; a listed extension's hook leaves a template it finds in place.
[contract.root.workspace.docs-url]
types = ["str"]
doc = "the URL template task names in --help, --list and --json rows link to, for pages kept outside the docs extension: {path} is the task's address joined by slashes, {slug} joined by dashes; when absent, the docs extension's task pages if it is listed with a site-url, and no links otherwise"

[contract.root.workspace.extensions]
types = ["list"]
doc = "the extensions the workspace mounts with what they require, each by name, written as the canonical list: no extension another listed one requires unless its entry carries without, in composition order"

[contract.root.workspace."extensions[]"]
types = ["str", "table"]
doc = "one extension: its name, or a table with its name and the targets it leaves out"

[contract.root.workspace."extensions[]".name]
types = ["str"]
doc = "the extension's name"

[contract.root.workspace."extensions[]".without]
types = ["strs"]
doc = "the extensions this one contributes nothing to, each one of the installed set it declares a contribution for; it contributes to every other one, one listed later included, and to all of them when absent"

[contract.root.workspace.hosts]
types = ["strs"]
doc = "the hosts the workspace supports and locks tools for: platforms or host keys, ! before one removing it; every host when absent"

[contract.root.workspace.uv-cache-limit]
types = ["str"]
doc = "the size uv's cache may reach on a machine before `fm doctor` reports it and `--fix` prunes it: a number with K, M, G or T; 10G when unset"

[contract.root.workspace.name]
types = ["str"]
doc = "the project's name, for its project file, README and links; the workspace is unborn without it"

[contract.root.workspace.namespace]
types = ["str"]
doc = "the dotted Python namespace the members import under, which starts each new member's name; the project's name in lower case, with underscores, when absent"

# workshop.toml in a package's directory.

[contract.package.categories]
types = ["table"]
doc = "categories the package gives its own paths, which win over its extensions' rules"

[contract.package.categories."*"]
types = ["strs"]
doc = "a category, by its name, to the paths it takes, as patterns relative to the package"

[contract.package.ci]
types = ["table"]
doc = "the package's own CI: the points it adds"

# A point a package contributes. It declares no grant, secret or
# environment: a scheduled workflow with one on a public repository is
# a foothold, so such a key is unknown and refuses, and a grant stays
# the root contract's decision.
[contract.package.ci.point]
types = ["list"]
doc = "the scheduled points the package adds, each a workflow of its own"

[contract.package.ci."point[]"]
types = ["table"]
doc = "one point: a workflow that runs one task on the clock and by dispatch"

[contract.package.ci."point[]".args]
types = ["strs"]
doc = "the task's arguments, formatted with the run's facts: {display}, {label}, {os} and {python}; none when absent"

[contract.package.ci."point[]".every]
types = ["str"]
doc = "how often the task runs: 1w on Mondays, 2w on the Mondays of even ISO weeks; every run when absent"
values = ["1w", "2w"]

[contract.package.ci."point[]".name]
types = ["str"]
doc = "the point's name, which its workflow file and its job take: lower-case letters, digits and dashes"

[contract.package.ci."point[]".pythons]
types = ["strs"]
doc = "the Pythons the job runs on, one leg each; the newest Python the gate runs when absent"

[contract.package.ci."point[]".runners]
types = ["strs"]
doc = "the runner labels the job runs on, one leg each; the root's [ci] runners when absent"

[contract.package.ci."point[]".task]
types = ["str"]
doc = "the task the job runs, by its dotted name"

[contract.package.depends]
types = ["list"]
doc = "the package's edges on other members of the workspace"

[contract.package."depends[]"]
types = ["table"]
doc = "one edge: the member, what the edge is for, and the lowest version taken"

[contract.package."depends[]".floor]
types = ["str"]
doc = "the lowest released version of the member the package takes, which its manifest must require"

[contract.package."depends[]".kind]
types = ["str"]
doc = "what the edge is for: build or runtime, each matched against the package's requirements; test, matched against its test requirements where its set answers them; tool, which no manifest names; build when absent"
values = ["build", "runtime", "test", "tool"]

[contract.package."depends[]".path]
types = ["str"]
doc = "the member depended on, by its directory from the workspace's root"

[contract.package.description]
types = ["str"]
doc = "the package's one-line description; one naming the package and the project when absent"

[contract.package.dev-extras]
types = ["strs"]
doc = "the extras the package's entry in the root's dev group installs"

[contract.package.extensions]
types = ["strs"]
doc = "the extensions the package is composed of, by name: its minimal list, with no extension another listed one requires"

[contract.package.name]
types = ["str"]
doc = "the package's distribution name"

[contract.package.owners]
types = ["table"]
doc = "who reviews the package, written into the forge's code owners file"

[contract.package.owners.approvals]
types = ["int"]
doc = "how many of the owners' approvals a change to the package needs; 0 when absent"

[contract.package.owners.teams]
types = ["strs"]
doc = "the forge teams that own the package, each under the root's [forge] owner"

[contract.package.owners.users]
types = ["strs"]
doc = "the forge users who own the package"

[contract.package.phases]
types = ["table"]
doc = "options the package sets on the steps of its phases, by phase and step"

[contract.package.phases."*"]
types = ["table"]
doc = "a phase, by its name: a value for every step of the phase, or a table per step"

[contract.package.phases."*"."*"]
types = ["any"]
doc = "an option for every step of the phase, or a table of options for one step, which wins over the phase's value key by key"

[contract.package.phases."*"."*"."*"]
types = ["any"]
doc = "an option of the step; the option's default when absent"

[contract.package.release]
types = ["table"]
doc = "how the release train releases the package"

[contract.package.release.baseline]
types = ["str"]
doc = "the version the package's line continues from, for a package released elsewhere before; 0.0.0 when absent"

[contract.package.release.prove]
types = ["strs"]
values = ["floor", "latest", "head"]
doc = "the resolutions a release tests the package at, each at most once: floor, latest and head; the root's list when absent"

[contract.package.release.publish]
types = ["bool"]
doc = "whether the release uploads the package to its registry; true when absent, and a package that does not is still versioned, built and tagged"

# extension.toml beside an extension's package.

[contract.extension.ci]
types = ["table"]
doc = "the CI the extension adds to the builtin points"

[contract.extension.ci.jobs]
types = ["table"]
doc = "the jobs the extension adds to the builtin points, by point"

[contract.extension.ci.jobs."*"]
types = ["table"]
doc = "a builtin point, by its name: gate, merge, nightly or release"

[contract.extension.ci.jobs."*"."*"]
types = ["table"]
doc = "a job the extension adds to the point, by name; a name the point already has, declared, inherited or contributed, joins that job: its entries follow the job's own and its plumbing renders on the job under the point's event condition"

[contract.extension.ci.jobs."*"."*".collects]
types = ["str"]
doc = "the artifact the job downloads before it enters, by the name a job of the point publishes it under, into the directory that job's paths start in; none when absent"

[contract.extension.ci.jobs."*"."*".conan-cache]
types = ["bool"]
doc = "whether the job builds native packages, so conan's home is restored before it enters and saved after; false when absent"

[contract.extension.ci.jobs."*"."*".deploy]
types = ["str"]
doc = "the function naming the seam the job publishes a site through, module:function given the workspace's root; none when absent"

[contract.extension.ci.jobs."*"."*".entries]
types = ["strs"]
doc = "the tasks the job runs, in order, each by its dotted name and each one the extension defines"

[contract.extension.ci.jobs."*"."*".fetch]
types = ["str"]
doc = "how deep the job's checkout is: full for every commit, tags for the tags as well, 2 for the commit and its parent; the commit alone when absent"
values = ["full", "tags", "2"]

[contract.extension.ci.jobs."*"."*".gates]
types = ["bool"]
doc = "whether the gate point's verdict waits for the job; false when absent"

[contract.extension.ci.jobs."*"."*".inputs]
types = ["table"]
doc = "the files the job's entries read: on a pull request under [ci] affected-legs, a change that touches none of them skips the entries; the job always runs when absent"

[contract.extension.ci.jobs."*"."*".inputs.ignores]
types = ["strs"]
doc = "files whose change never counts, though a pattern of reads or widens names them; none when absent"

[contract.extension.ci.jobs."*"."*".inputs.on-removal]
types = ["bool"]
doc = "whether a deleted or moved file anywhere runs the job's entries; false when absent"

[contract.extension.ci.jobs."*"."*".inputs.reads]
types = ["strs"]
doc = "the files the job's entries read, as patterns relative to the root where ** spans directories"

[contract.extension.ci.jobs."*"."*".inputs.widen]
types = ["str"]
doc = "the job's own further reason to run, a function module:function given the changes; none when absent"

[contract.extension.ci.jobs."*"."*".inputs.widens]
types = ["strs"]
doc = "files the entries do not read whose change runs the job all the same; none when absent"

[contract.extension.ci.jobs."*"."*".installs]
types = ["str"]
doc = "the function naming the system packages the job installs before it enters, module:function given the workspace's root; none when absent"

[contract.extension.ci.jobs."*"."*".judges]
types = ["strs"]
doc = "the tasks that judge the run before the verdict, on a point's own verdict job alone: each runs before the job collects the run's rows, and a red one stops the job before the verdict and the stamp; none when absent"

[contract.extension.ci.jobs."*"."*".labels]
types = ["str"]
doc = "the function naming the runner labels the job fans out to, one leg each, module:function given the workspace's root; a workspace it names no label for renders no such job, and a need on it drops; one job on one runner when absent"

[contract.extension.ci.jobs."*"."*".needs]
types = ["strs"]
doc = "the jobs of the point this one waits for; on a join, the jobs the joined job waits for besides its own, where the point has that job of its own, and a join of a job the point inherits names none; none when absent"

[contract.extension.ci.jobs."*"."*".paths]
types = ["strs"]
doc = "the paths the artifact the job publishes carries, as the forge globs them; required with publishes"

[contract.extension.ci.jobs."*"."*".publishes]
types = ["str"]
doc = "the artifact the job uploads after its entries, by name, so a job of the point can collect it; none when absent"

[contract.extension.ci.jobs."*"."*".note]
types = ["str"]
doc = "the comment the rendered CI file carries above the job"

[contract.extension.ci.jobs."*"."*".token]
types = ["str"]
doc = "the credential the job's tasks see as FORGE_TOKEN: job, the run's own token, the only one an extension's job takes; none when absent"
values = ["job"]

[contract.extension.contract]
types = ["table"]
doc = "the contract keys the extension owns, by contract"

[contract.extension.contract."*"]
types = ["table"]
doc = "a contract the extension declares keys in: root for the workspace's workshop.toml, package for a package's"

[contract.extension.contract."*"."*"]
types = ["any"]
doc = "a key of that contract: a table with its types, and its values and doc where it has them, and the keys beneath it"

[contract.extension.deletes]
types = ["table"]
doc = "the shipped files of the base and of the extensions this one requires that it deletes"

[contract.extension.deletes."*"]
types = ["str"]
doc = "a shipped file of the base or of an extension this one requires, <owner>:<name>, to the reason this one deletes it"

[contract.extension.extension]
types = ["table"]
doc = "the extension's identity: what it does, its workshop API version, its plugin, the extensions it requires, and what it waits for while dormant"

[contract.extension.extension.description]
types = ["str"]
doc = "what the extension does, in a sentence or two, which opens its block in the agent's guidance and the site's development pages; the conformance kit requires it"

[contract.extension.extension.api-version]
types = ["int"]
doc = "the workshop API version the extension is written for, which the mount refuses unless it is this workshop's; 1 when absent"

[contract.extension.extension.plugin]
types = ["str"]
doc = "the footman plugin that carries the extension's verbs; when absent, the extension registers what it declares and mounts no verbs"

[contract.extension.extension.requires]
types = ["strs"]
doc = "the extensions this one cannot work without, which join every set that holds it and come before it in composition order; none when absent"

[contract.extension.extension.dormant-until]
types = ["str"]
doc = "what another extension does for this one by declaring a [for.<this>] table, as a verb such as measures: until a listed extension contributes such a table, this one is dormant, registers no step and no job, and fm extensions and fm doctor name the installed extensions that would wake it; never dormant when absent"

[contract.extension.for]
types = ["table"]
doc = "what the extension adds to other listed extensions, by target"

[contract.extension.for."*"]
types = ["table"]
doc = "a target extension, by its listed name, to what this one adds while both are listed: every table the top level takes but [extension], [for] and [contract]; the files it ships under content/for/<target>/ are delivered then too"

[contract.extension.fragments]
types = ["table"]
doc = "the files the extension's code writes, by their path from the root; a path ending in / is a directory whose files the render names; written while the root's list or a package's set holds the extension"

[contract.extension.fragments."*"]
types = ["table"]
doc = "one file the extension's code writes, or a directory of them: its render, and whether it is the checkout's alone"

[contract.extension.fragments."*".render]
types = ["str"]
doc = "module:name in the extension's own package, called with the workspace root: for a file, its text, or nothing for no file; for a directory, each file's path under it to its text, or to the shipped file it links to"

[contract.extension.fragments."*".local]
types = ["bool"]
doc = "whether the files belong to this checkout alone and are never committed; false when absent"

[contract.extension.phases]
types = ["table"]
doc = "the phases the extension declares and the steps it adds, by phase: the base's, or one an installed extension declares"

[contract.extension.phases."*"]
types = ["table"]
doc = "one phase: its declaration when the extension declares it, and the steps the extension adds to it, each a table of its own"

[contract.extension.phases."*".after]
types = ["strs"]
doc = "the phases this one follows in the train's order, when the extension declares the phase; none when absent"

[contract.extension.phases."*".gated]
types = ["bool"]
doc = "whether fm check runs the phase, when the extension declares it; false when absent"

[contract.extension.phases."*".keys]
types = ["table"]
doc = "the keys the engine running the phase gives its steps, when the extension declares the phase, each to its type; a step reads one like any key, and no step provides one"

[contract.extension.phases."*".keys."*"]
types = ["str"]
doc = "an engine key's type"
values = ["str", "int", "bool", "path", "strs", "paths", "table"]

[contract.extension.phases."*".level]
types = ["str"]
doc = "where the phase runs, when the extension declares it: package for one package at a time, workspace for the workspace once; package when absent"
values = ["package", "workspace"]

[contract.extension.phases."*".verb]
types = ["bool"]
doc = "whether a verb is generated for the phase, fm <phase> with a sub-task per step, when the extension declares it; false when absent"

[contract.extension.phases."*"."*"]
types = ["table"]
doc = "a step of the phase, by the one-word name its verb gives it; it answers to <phase>.<step>, runs once over the workspace in a workspace-level phase and once per package whose set holds the extension in a package-level one"

[contract.extension.phases."*"."*".after]
types = ["strs"]
doc = "the steps this one runs after in a gate, by name; an installed extension's step the workspace does not mount orders nothing; none when absent"

[contract.extension.phases."*"."*".claims]
types = ["list"]
doc = "the categories the step judges, each with the rules it leaves out there and the suffixes it reads; when absent, the step's own code decides what it reads"

[contract.extension.phases."*"."*"."claims[]"]
types = ["table"]
doc = "one category the step judges, with the rules it leaves out and the suffixes it reads there"

[contract.extension.phases."*"."*"."claims[]".category]
types = ["str"]
doc = "the category the step judges: source, test, test-support, configuration, example, or another the base's category tables name"

[contract.extension.phases."*"."*"."claims[]".ignore]
types = ["strs"]
doc = "the rule codes the step does not apply in the category, written into the tool's per-file ignores; none when absent"

[contract.extension.phases."*"."*"."claims[]".suffixes]
types = ["strs"]
doc = "the file suffixes the step reads in the category, each starting with a dot; every file when absent"

[contract.extension.phases."*"."*".deletes]
types = ["table"]
doc = "the steps of the base or of an extension this one requires, in a [for.<target>] table also the target's, that never run for a package whose set holds this one, each <owner>:<phase>.<step> of an installed step that runs once per package, to the reason; none when absent"

[contract.extension.phases."*"."*".deletes."*"]
types = ["str"]
doc = "another extension's step, <owner>:<phase>.<step>, to the reason it never runs where this one is held"

[contract.extension.phases."*"."*".enabled]
types = ["bool"]
doc = "whether the step registers while the extension is listed; true when absent, and a workspace turns a false one on at the step's address in its root contract"

[contract.extension.phases."*"."*".env]
types = ["table"]
doc = "the variables every call of a step in words gets, over the run's own"

[contract.extension.phases."*"."*".env."*"]
types = ["str"]
doc = "the variable's value; a placeholder in it is answered as in the words"

[contract.extension.phases."*"."*".extensions]
types = ["strs"]
doc = "the extensions whose packages the step judges: each package whose set holds one; every package when absent"

[contract.extension.phases."*"."*".fix]
types = ["str", "strs"]
doc = "what rewrites what the step judges, run before any judge under --fix, in main's shape: a template, or the function, module:function; the step only judges when absent"

[contract.extension.phases."*"."*".flags]
types = ["strs"]
doc = "the command-line flags the step reads: point, to select a CI point's tests; none when absent"

[contract.extension.phases."*"."*".fragments]
types = ["table"]
doc = "the configuration the composed files carry for the step, by file; none when absent"

[contract.extension.phases."*"."*".fragments."*"]
types = ["str", "table"]
doc = "a file, by its name, to its text for a project file, or a table of its text and extensions for a file in each package"

[contract.extension.phases."*"."*".fragments."*".extensions]
types = ["strs"]
doc = "the extensions whose packages carry the file: each package whose set holds one"

[contract.extension.phases."*"."*".fragments."*".text]
types = ["str"]
doc = "the fragment's Jinja text, rendered with each package's data"

[contract.extension.phases."*"."*".inputs]
types = ["table"]
doc = "the files a workspace step reads, so a run that knows its changes judges it only when one of them changed; when absent, the step narrows by packages alone"

[contract.extension.phases."*"."*".inputs.ignores]
types = ["strs"]
doc = "files whose change never counts, though a pattern of reads or widens names them; none when absent"

[contract.extension.phases."*"."*".inputs.on-removal]
types = ["bool"]
doc = "whether a deleted or moved file anywhere runs the step over everything it reads; false when absent"

[contract.extension.phases."*"."*".inputs.per-file]
types = ["bool"]
doc = "whether the step judges each changed file it reads on its own, rather than everything when one changes; true when absent"

[contract.extension.phases."*"."*".inputs.reads]
types = ["strs"]
doc = "the files the step judges, as patterns relative to the root where ** spans directories"

[contract.extension.phases."*"."*".inputs.widen]
types = ["str"]
doc = "the step's own further reason to run over everything, a function module:function given the changes; none when absent"

[contract.extension.phases."*"."*".inputs.widens]
types = ["strs"]
doc = "files the step does not judge whose change runs it over everything it reads; none when absent"

[contract.extension.phases."*"."*".isolated]
types = ["bool"]
doc = "the side of the phase the step serves, in a phase whose engine gives isolated: true the isolated one, from a copy of the sources in a fresh environment, false the tree; both when absent"

[contract.extension.phases."*"."*".main]
types = ["str", "strs"]
doc = "the step's body: a template, the tool's name as tools names it then its arguments, with {paths} where the paths the run reaches go and {arguments} where the words after -- go, the exit code the verdict; or the function that runs it, module:function in the extension's own package"

[contract.extension.phases."*"."*".matrix]
types = ["table"]
doc = "the placeholders the calls of a step in words vary: one call per combination of values, in parallel, each its own verdict"

[contract.extension.phases."*"."*".matrix."*"]
types = ["strs"]
doc = "the values the placeholder takes, one call each"

[contract.extension.phases."*"."*".options]
types = ["table"]
doc = "the options a package may set on the step in its [phases.<phase>.<step>] table; enabled alone when absent"

[contract.extension.phases."*"."*".options."*"]
types = ["table"]

[contract.extension.phases."*"."*".options."*".default]
types = ["any"]
doc = "the value the step reads when no package sets the option; none when absent"

[contract.extension.phases."*"."*".options."*".doc]
types = ["str"]
doc = "one line saying what the option changes"

[contract.extension.phases."*"."*".options."*".type]
types = ["str"]
doc = "the option's type, which a package's value must have: bool, str, int or strs, a list of strings"
values = ["bool", "str", "int", "strs"]

[contract.extension.phases."*"."*".outputs]
types = ["strs"]
doc = "the paths the step writes, each relative to the root, a directory ending in /, or package/<path> for the path in each package; never docs/ itself; when run_phase runs the phase, each output no running step declares is removed first, so a step that stops running leaves nothing behind wherever it wrote; none when absent"

[contract.extension.phases."*"."*".provides]
types = ["table"]
doc = "the context keys the step writes inside its phase, each to its type; one step of a phase provides a key"

[contract.extension.phases."*"."*".provides."*"]
types = ["str"]
doc = "a context key's type"
values = ["str", "int", "bool", "path", "strs", "paths", "table"]

[contract.extension.phases."*"."*".reads]
types = ["strs"]
doc = "the context keys the step reads inside its phase, each one another step provides, which runs first"

[contract.extension.phases."*"."*".replaces]
types = ["table"]
doc = "the steps of the base or of an extension this one requires that it replaces, in a [for.<target>] table also the target's, each <owner>:<phase>.<step> to the reason; naming the step at this one's address lets a second extension take the address; none when absent"

[contract.extension.phases."*"."*".replaces."*"]
types = ["str"]
doc = "a step of the base or of an extension this one requires, <owner>:<phase>.<step>, to the reason this one replaces it"

[contract.extension.phases."*"."*".safe-fix]
types = ["str", "strs"]
doc = "what rewrites under --safe-fix, removing no code, in main's shape; fix when absent"

[contract.extension.phases."*"."*".scope]
types = ["str"]
doc = "what one run of the step judges: workspace for the whole workspace at once, package for one package at a time; workspace when absent"
values = ["workspace", "package"]

[contract.extension.phases."*"."*".tests-only]
types = ["bool"]
doc = "whether a package step also runs when a package's change is confined to its tests; false when absent"

[contract.extension.phases."*"."*".tools]
types = ["strs"]
doc = "the tools the step runs, as the tool profile names them, each required while a package the step judges is present; none when absent"

[contract.extension.categories]
types = ["table"]
doc = "the categories the extension gives the paths of each package whose set holds it, which a package's own [categories] overrides"

[contract.extension.categories."*"]
types = ["strs"]
doc = "a category, by its name, to the paths it takes, as patterns relative to the package"

[contract.extension.queries]
types = ["table"]
doc = "the queries the extension declares, each a table with its combine rule, and the ones it answers, each a function module:name or a table with its literal value"

[contract.extension.queries."*"]
types = ["str", "table"]
doc = "a query, by its name: module:name in the extension's own package, called with the package or the workspace root, answers it; a table with value answers it with that value; a table with combine, level, default or values declares it"

[contract.extension.queries."*".combine]
types = ["str"]
doc = "how the query's answers make one: union for lists, nearest for the answer of the extension no other answering one requires, agreed for one value every answer holds, or a function module:name; union when absent"

[contract.extension.queries."*".level]
types = ["str"]
values = ["package", "workspace"]
doc = "whether the query is asked about one package, answered by its set, or about the workspace, answered by the installed set, each in composition order; package when absent"

[contract.extension.queries."*".default]
types = ["any"]
doc = "the answer while no extension answers; the rule's answer over nothing when absent"

[contract.extension.queries."*".values]
types = ["list"]
doc = "the only answers the query takes; any answer when absent"

[contract.extension.queries."*".value]
types = ["any"]
doc = "the extension's literal answer to the query"

[contract.extension.replaces]
types = ["table"]
doc = "the shipped files of the base and of the extensions this one requires that its own files replace"

[contract.extension.replaces."*"]
types = ["str"]
doc = "a shipped file of the base or of an extension this one requires, <owner>:<name>, to the reason this one's file of that name replaces it"

[contract.extension.templates]
types = ["table"]
doc = "the templates the extension declares, each the verb fm new.package.<template> <name> that creates a package from it, offered while the workspace's installed set holds the extension"

# A template, by the name its verb fm new.package.<template> ends in:
# lower-case letters, digits and hyphens. Its files live under
# content/templates/<name>/ beside the file declaring it. Its doc key is declared below, so the
# table carries none of its own.
[contract.extension.templates."*"]
types = ["table"]

[contract.extension.templates."*".doc]
types = ["str"]
doc = "one line saying what a package born from the template is, which its verb shows as its help; required"

[contract.extension.templates."*".extends]
types = ["str"]
doc = "the template whose files the birth writes first, this one's file winning for a path both hold; none when absent"

[contract.extension.templates."*".extensions]
types = ["strs"]
doc = "the extensions a package born from the template lists, written into its contract in their canonical form; required, [] for none"

[contract.extension.templates."*".fixes]
types = ["table"]
doc = "each option of a template this one extends, to the answer a package born from this one takes for it; a birth from this one takes no answer for it"

[contract.extension.templates."*".fixes."*"]
types = ["str", "int", "bool"]
doc = "the answer the option takes"

[contract.extension.templates."*".options]
types = ["table"]
doc = "the template's creation options, each answered as fm new.package.<template> <name> --<option>=<answer>; a template extending this one takes them too"

# An option, by the name --<option> spells: lower-case letters, digits
# and hyphens. Its answer renders the template's files as a variable,
# the name with its hyphens as underscores.
[contract.extension.templates."*".options."*"]
types = ["table"]

[contract.extension.templates."*".options."*".choices]
types = ["strs"]
doc = "the answers the option takes; required unless type is given"

[contract.extension.templates."*".options."*".default]
types = ["str", "int", "bool"]
doc = "the answer when the command line gives none; the option is required when absent"

[contract.extension.templates."*".options."*".doc]
types = ["str"]
doc = "one line saying what the answer decides, which the template's verb shows in its help and completion; required"

[contract.extension.templates."*".options."*".type]
types = ["str"]
values = ["str", "int", "bool"]
doc = "the type of the answer; required unless choices is given"


# The base's phases, in the grammar of [contract.extension.phases."*"]:
# the keys the engine running the phase gives its steps, each to its
# type; level, package for a phase run over one package at a time and
# workspace for one run over the workspace once; gated, whether fm check
# runs it; after, the phases it follows in the train's order; and verb,
# whether a verb is generated for it. The train runs stamp, build, test,
# publish and verify in that order; fm sync, fm clean and fm run run
# their phases; fm check runs the gated ones.

[phases.sync]
level = "workspace"
gated = false
after = []
verb = false

[phases.clean]
level = "package"
gated = false
after = []
verb = false

[phases.build]
level = "package"
gated = true
after = ["stamp"]
verb = true

[phases.build.keys]
isolated = "bool"
configuration = "str"
epoch = "int"

[phases.format]
level = "workspace"
gated = true
after = []
verb = true

[phases.lint]
level = "workspace"
gated = true
after = []
verb = true

[phases.typecheck]
level = "workspace"
gated = true
after = []
verb = true

[phases.typecomplete]
level = "workspace"
gated = true
after = []
verb = true

[phases.examples]
level = "workspace"
gated = true
after = []
verb = true

[phases.drift]
level = "workspace"
gated = true
after = []
verb = true

[phases.provenance]
level = "workspace"
gated = true
after = []
verb = true

[phases.layering]
level = "workspace"
gated = true
after = []
verb = true

[phases.test]
level = "workspace"
gated = true
after = ["build"]
verb = true

[phases.test.keys]
isolated = "bool"
resolution = "str"
release-dirs = "paths"

[phases.stamp]
level = "package"
gated = false
after = []
verb = false

[phases.stamp.keys]
version = "str"

[phases.publish]
level = "package"
gated = false
after = ["test"]
verb = false

[phases.publish.keys]
version = "str"
registry-target = "table"

[phases.verify]
level = "package"
gated = false
after = ["publish"]
verb = false

[phases.verify.keys]
version = "str"
tree = "path"
interpreter = "str"
index = "str"
extras = "str"

[phases.configure]
level = "workspace"
gated = false
after = []
verb = false

[phases.run]
level = "package"
gated = false
after = ["build"]
verb = false

[phases.run.keys]
executable = "str"

# The base's queries, in the grammar an extension declares a query in
# under the same table of its extension.toml. A package-level query is
# asked with a package and answered by its set in composition order; a
# workspace-level one with the workspace root and answered by the
# installed set in composition order.

# The modules that declare a package's public API, by import path.
[queries.public-modules]
combine = "union"

# Where a package's build writes its compilation database.
[queries.compile-commands]
combine = "nearest"

# The names other packages reference a package's code by.
[queries.module-roots]
combine = "union"

# What each of a package's sources references, one record per source:
# its path, the name other code references it by, each name it
# references with how the source makes the reference, and the names
# its language's conventions account for. A record naming a file
# outside the package, or a file two extensions answer for, refuses.
[queries.references]
combine = "union"

# The version a package's own manifests declare.
[queries.current-version]
combine = "agreed"

# Every file the stamp phase may write a version into.
[queries.version-files]
combine = "union"

# What a package's native manifests require, each distribution's name
# to its constraint; a name two answers constrain differently refuses.
[queries.requirements]
combine = "livery.workshop._queries:merged"

# The writers of a requirement on a sibling into a package's native
# manifests, each a function called with the package, the sibling and
# the floor. Every writer of the package's set is called, and each takes
# a sibling of its own ecosystem alone, answering None for any other; a
# sibling no writer takes refuses, naming the sibling's set.
[queries.requirement-writers]
combine = "union"

# What a package's native manifests require for its tests alone, each
# distribution's name to its constraint. A package whose set answers
# it has a home for its test edges, and layering.graph judges each
# test edge against it; a name two answers constrain differently
# refuses.
[queries.test-requirements]
combine = "livery.workshop._queries:merged"

# The writers of a test requirement on a sibling into a package's
# native manifests, called as the requirement writers are. The fix of
# layering.graph calls every writer of the package's set for a test
# edge whose line is missing or names another floor, and each takes a
# sibling of its own ecosystem alone, answering None for any other.
[queries.test-requirement-writers]
combine = "union"

# The distributions a package releases, each as its ecosystem and name.
# The release train publishes a package to the registry of the one
# ecosystem its distributions name.
[queries.distributions]
combine = "union"

# The registry a package releases to, as a probe of the versions it
# serves: an object whose versions(name) answers them, which the release
# train polls until an upload is served. The extension that releases the
# package's distribution answers; an empty answer is left out, and two
# answers that differ refuse.
[queries.registry]
combine = "agreed"

# The executables fm run may start, by name; a name two extensions
# answer refuses.
[queries.executables]
combine = "livery.workshop._queries:owned"

# What the host must provide for a package and no store installs, such
# as a C compiler, each by the name it resolves by on PATH: fm doctor
# and fm env.check name each one that does not resolve.
[queries.host-tools]
combine = "union"

# The marketplace ids of the editor extensions the listed extensions
# recommend, which the rendered .vscode/extensions.json lists.
[queries.editor-extensions]
level = "workspace"
combine = "union"

# The lines of the root project file's dev dependency group: what the
# listed extensions need in the venv, each line naming its floor.
# Declared by the base while the python extension ships in its wheel.
[queries."python.dev-group"]
level = "workspace"
combine = "union"

# The lines of the root project file's docs dependency group: what the
# listed extensions' site build imports from the venv, each line naming
# its floor; empty while no listed extension answers. Declared by the
# base while the python extension ships in its wheel.
[queries."python.docs-group"]
level = "workspace"
combine = "union"

# The words the rendered pytest.toml's addopts holds, as the test
# runner's extension answers them. Declared by the base while the
# python extension ships in its wheel.
[queries."python.test.addopts"]
level = "workspace"
combine = "union"

# The state store's series the listed extensions keep beside the
# base's own, each a livery.git Series or Keyed family: the janitor
# bounds them and fm store.ls lists them.
[queries."store.series"]
level = "workspace"
combine = "union"

# The release notes' provider, which the release train asks for each
# release's entry: one answer, from the extension that writes the
# history.
[queries.release-notes]
level = "workspace"
combine = "nearest"

# The tools the base runs in every workspace: uv makes the venv every
# step runs in, so the lock pins it in a workspace with no package too.
[toolroom]
requires = ["uv"]

# The members a job of the release point builds before the wave, each
# member's path to the job's name. The wave publishes what the run
# collected for them instead of building them again, and the entry
# installs those of them uv installs after the tools. A member two
# answers give different jobs refuses.
[queries.job-built-members]
level = "workspace"
combine = "livery.workshop._queries:merged"

# What the listed extensions add to the checkout step of the rendered
# GitHub and Gitea workflows: each input of the checkout action by its
# name, to its value as the workflow writes it. GitLab's runner checks
# out by itself and reads none. An input two answers give different
# values refuses, and so does one the step sets from the job's own
# declaration.
[queries.checkout-inputs]
level = "workspace"
combine = "livery.workshop._ci_generate:checkout_inputs"

# The base's templates, in the grammar an extension declares one in
# under the same table of its extension.toml; their files live under
# content/templates/<name>/ beside this file. The extension format is
# the base's, and so is the template of a package that is an extension.
[templates.workshop-extension]
doc = "a workshop extension: a python package with its extension.toml, its content and its verbs, and with --app a branded App"
extensions = ["python"]
extends = "python-library"
# The extension's pyproject.toml is its own, and its one script is the
# App's, so it takes no --command.
fixes = { command = "" }

# The answer names the branded App: a script that runs the workshop
# under that name, with this extension's verbs. Without one the package
# puts nothing on PATH.
[templates.workshop-extension.options.app]
doc = "the name of a branded App, a script on PATH that runs the workshop with this extension's verbs; none by default"
type = "str"
default = ""
