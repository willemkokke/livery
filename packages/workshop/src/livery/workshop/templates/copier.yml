# The workshop's template source: one template, two kinds, chosen by
# `kind` and served from the matching subdirectory. Every question
# carries a default or `when: false`, so an existing instance updates
# without a prompt.
#
# Only identity is asked. Contract facts (layers, forge, owners, CI)
# live in workshop.toml; environment facts live in the committed
# .repo.env. The `when: false` entries below are injected at render
# time from the contract by the workshop, never asked and never
# stored.
_min_copier_version: "9.10.0"
_subdirectory: "{{ kind }}"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_envops:
  keep_trailing_newline: true
  autoescape: false

kind:
  type: str
  help: "What to render: a workspace root, or one Python package"
  choices: [project, package-python, package-python-layer, package-cpp-conan]
  default: project

project_name:
  type: str
  help: "The workspace's name (also the repository name)"
  default: "{{ _copier_conf.dst_path | basename }}"

project_description:
  type: str
  help: "One sentence for the virtual root's [project] table"
  default: "The {{ project_name }} monorepo (virtual root)."

author_name:
  type: str
  help: "Who the [project] authors entry names"
  default: "{{ project_name }} authors"

author_email:
  type: str
  help: "The authors entry's email (empty renders no authors entry)"
  default: ""

copyright_year:
  type: str
  help: "The year in a new package's LICENSE"
  default: "2026"

namespace_package:
  type: str
  help: "Dotted namespace the packages live in (PEP 420, no __init__)"
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"

runner_prog:
  type: str
  default: fm
  when: false
  help: the CLI name the workshop runs under; injected at render time

python_floor:
  type: str
  default: "3.11"
  when: false
  help: >-
    the oldest Python the workspace supports; injected at render time
    from the root pyproject's requires-python

layer_imports:
  type: yaml
  default: [livery.workshop]
  when: false
  help: >-
    the contract's layers as import paths; injected at render time
    from workshop.toml

layer_requirements:
  type: yaml
  default: []
  when: false
  help: >-
    the dev-group requirement for each layer that is not already a
    workspace member; injected at render time from workshop.toml

template_source_label:
  type: str
  default: "the template source"
  when: false
  help: >-
    what the provenance headers call the template source; injected at
    render time from the contract's templates value

packages:
  type: yaml
  help: >-
    The workspace members: dir (under packages/), name (the
    distribution), dev (the dev-group requirement, which may carry
    extras the dev loop needs)
  default: []

# --- package-python ---------------------------------------------------

package_name:
  type: str
  help: "The distribution name (<namespace>-<dir> by convention)"
  default: "{{ namespace_package | replace('.', '-') }}-{{ _copier_conf.dst_path | basename }}"

package_description:
  type: str
  default: "{{ package_name }}: a {{ project_name }} workspace package."

# The directory under packages/, which is also the package's tag
# line. Recorded rather than derived from the destination: the render
# gate renders into a scratch directory, and a derived value would
# name that instead.
package_dir:
  type: str
  default: "{{ _copier_conf.dst_path | basename }}"
  when: false

# The forge facts a package's changelog links through; injected at
# render time from workshop.toml, never asked and never stored.
forge_kind:
  type: str
  default: github
  when: false

forge_owner:
  type: str
  default: ""
  when: false

forge_url:
  type: str
  default: ""
  when: false

# The module name inside the namespace, derived from the distribution
# name minus the namespace prefix: acme-tools in acme -> tools.
project_slug:
  type: str
  default: >-
    {% set ns_prefix = namespace_package.replace('.', '-') + '-' if namespace_package else ''
    %}{{ package_name.removeprefix(ns_prefix).replace('-', '_') }}
  when: false

# Filesystem path under src/ and tests/ - slashes nest directories.
source_path:
  type: str
  default: >-
    {% if namespace_package
    %}{{ namespace_package.replace('.', '/') }}/{{ project_slug
    }}{% else
    %}{{ project_slug
    }}{% endif %}
  when: false

# The dotted import path (acme.tools).
import_path:
  type: str
  default: >-
    {% if namespace_package
    %}{{ namespace_package }}.{{ project_slug
    }}{% else
    %}{{ project_slug
    }}{% endif %}
  when: false
