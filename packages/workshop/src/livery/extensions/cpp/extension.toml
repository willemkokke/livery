# C and C++: what the languages tell the workshop about a package's
# files, and the compilers the host must provide. Optional for a build;
# it sharpens what a change runs, what the formatter and the linter
# judge, and what fm doctor and fm env.check look for on the host.

[extension]
api-version = 1

# What a C or C++ package's paths are to it: the sources and headers,
# the test sources, and the files beside them under tests/.
[categories]
test = ["tests/**/*.cpp", "tests/**/*.cc", "tests/**/*.cxx", "tests/**/*.c"]
test-support = ["tests/**"]
source = ["src/**", "include/**"]

# The questions about a package this extension answers: a C or C++
# package names no module, since other packages reach it through its
# headers.
[queries]
module-roots = "livery.extensions.cpp._language:module_roots"
public-modules = "livery.extensions.cpp._language:public_modules"

# The C and C++ compilers a build runs, which the host provides and no
# store installs: fm doctor and fm env.check name either one that does
# not resolve on PATH.
[queries.host-tools]
value = ["cc", "c++"]
