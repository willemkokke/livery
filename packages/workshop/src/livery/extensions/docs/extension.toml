# The docs extension: the site, its pages, the two phases around its
# build, its steps of the lint phase and its CI jobs.
# Read at every mount; its verbs arrive through its plugin.

[extension]
api-version = 1
# The footman plugin that carries the site's verbs.
plugin = "livery.extensions.docs"

# The site's address, its title, its description, and where it publishes.
[contract.root.docs]
types = ["table"]
doc = "the documentation site: its address, its title, its description and where it publishes"

# Task names link to the site's redirect page for each task, through
# the extension's pre_tasks hook, unless [workspace] docs-url is set.
[contract.root.docs.site-url]
types = ["str"]
doc = "the site's public address, ending in a slash, for its canonical links, its llms.txt and the task links in --help, --list and --json rows; no task links when absent"

[contract.root.docs.title]
types = ["str"]
doc = "the site's title; the project's name when absent"

[contract.root.docs.description]
types = ["str"]
doc = "the site's one-line description"

[contract.root.docs.publish]
types = ["str"]
values = ["pages", "container", "ssh", "none"]
doc = "where the site publishes; the forge's default when absent: pages on GitHub and GitLab, a container on Gitea"

# How the site documents a package. The table is the extension's whole,
# so a package's [docs] refuses, naming docs, while the workspace does
# not list it.
[contract.package.docs]
types = ["table"]
doc = "how the site documents the package"

# Whether the package gets an API reference. The extension that writes
# the reference reads it.
[contract.package.docs.api]
types = ["bool"]
doc = "whether the package's modules get API reference pages; true when absent"

# The verbs that write a package's pages before the site builds.
[contract.package.docs.generators]
types = ["list"]
doc = "the verbs that write the package's pages: a verb's name, or a table with the system packages it needs"

[contract.package.docs."generators[]"]
types = ["str", "table"]
doc = "one generator: a verb's name, or a table with the verb and the system packages it needs"
verb = { types = ["str"], doc = "the verb, a task the package ships" }
requires = { types = ["strs"], doc = "the system packages the verb needs on a docs machine" }

# Where the package sits in the site's Packages tree.
[contract.package.docs.name]
types = ["str"]
doc = "the package's place in the site's Packages tree, a dotted path whose last part is its label: workshop.extensions.ruff; its shallowest import path less the namespace every package shares, or its folder under packages/, when absent"

# A package's pages beyond the generated ones.
[contract.package.docs.coverage]
types = ["list"]
doc = "the static coverage reports the package's own tooling writes"

[contract.package.docs."coverage[]"]
types = ["table"]
doc = "one report: its name on the page and its directory"
label = { types = ["str"], doc = "the report's name on the page" }
path = { types = ["str"], doc = "the report's directory, relative to the package" }

[contract.package.docs.extra-css]
types = ["strs"]
doc = "stylesheets for the package's pages, relative to its docs/"

[contract.package.docs.extra-javascript]
types = ["list"]
doc = "scripts for the package's pages: a path, or a table with its attributes"

[contract.package.docs."extra-javascript[]"]
types = ["str", "table"]
doc = "one script: a path, or a table with its path and the script element's attributes"
path = { types = ["str"], doc = "the script, relative to the package's docs/" }
type = { types = ["str"], doc = "the script element's type" }
defer = { types = ["bool"], doc = "whether the script runs after the page parses" }
async = { types = ["bool"], doc = "whether the script runs as soon as it loads" }

# The links in the authored markdown resolve. A removed heading or a
# deleted or moved page runs the step over every page.
[phases.lint.doclinks]
main = "livery.extensions.docs._steps:doclinks_run"
inputs = { reads = ["docs/**/*.md", "packages/**/docs/**/*.md"], on-removal = true, widen = "livery.extensions.docs._steps:headings_removed" }

# The docs phase: what writes the site's generated pages, run by every
# docs verb before it assembles the config, its steps side by side. A
# listed extension that requires docs adds a step here at its top level,
# and any other in its [for.docs] table. The gate never runs it, and it
# has no verb of its own. Before it runs, the verb removes every
# generated tree, docs/_generated/ at the root and in each package, so
# a step that no longer runs leaves no page and no nav block behind.
[phases.docs]
level = "workspace"
gated = false
verb = false

# The task reference of every package that advertises footman.tasks
# entry points. Off unless the root contract turns it on with
# [phases.docs.task-reference] enabled = true.
[phases.docs.task-reference]
main = "livery.extensions.docs._taskref:task_reference_run"
enabled = false

# The verbs each package names under [docs] generators, run at the root
# in the packages' order, each verb once.
[phases.docs.generators]
main = "livery.extensions.docs._steps:generators_run"

# The deploy phase: what docs.publish runs on the built site just before
# it publishes it. A listed extension adds a step here in its [for.docs]
# table, to draw a page from what the merge left behind; a failing step
# stops the publish. The gate never runs it, and it has no verb of its
# own.
[phases.deploy]
level = "workspace"
gated = false
verb = false

# The strict site build: the gate point's verdict waits for it. The
# tags are fetched so the release view renders from the receipts; a
# tagless clone renders its no-tags fallback page instead.
[ci.jobs.gate.docs]
entries = ["docs.build"]
gates = true
fetch = "tags"
installs = "livery.extensions.docs._contract:docs_requirements"
note = """\
The strict site build: broken links and orphan pages go red here, \
required through the gate context, never inside the local check. On a \
push the built site is kept for the gate job, which adds this run's \
coverage trees and publishes it."""

# What the site reads: the workspace's docs, its zensical.toml and
# README, and each package's pages, nav, assets, examples and generated
# pages. A pull request that changes none of them skips the build.
[ci.jobs.gate.docs.inputs]
reads = [
    "docs/**",
    "zensical.toml",
    "README.md",
    "packages/**/docs/**/*.md",
    "packages/**/docs/nav.toml",
    "packages/**/docs/assets/**",
    "packages/**/docs/examples/**/*.py",
    "packages/**/docs/_generated/**",
]

# On the merge point the docs job keeps the site it built, so the
# site is built once per run.
[ci.jobs.merge.docs]
publishes = "site"
paths = ["site"]

# On the merge point the gate job takes the built site after its
# verdict, after the union it judged, and publishes it: docs.publish
# runs the deploy phase on the site, puts each declared coverage
# report's tree into it, and publishes it through the seam the root
# contract names: the container and ssh seams and none from here, the
# forge's pages by handing the site to the forge's own pages deploy.
[ci.jobs.merge.gate]
entries = ["docs.publish"]
collects = "site"
deploy = "livery.extensions.docs._contract:publish_seam"

# The site's config beyond the docs extension's own tables, a query a
# listed extension answers with the function that writes its tables for
# one config, given the packages the config covers: each answer's tables
# after the docs extension's, in list order. A table two answers write
# refuses naming both, and the joined config must parse.
[queries."docs.config"]
level = "workspace"
combine = "livery.extensions.docs._config:writers"

# The private-members policy the API reference renders, a query the
# listed extensions answer: the nearest answer, the one of the
# extension no other answering one requires, wins.
[queries."docs.members"]
level = "workspace"
combine = "nearest"
default = "public"
values = ["public", "all"]

# The site's theme, a query a theme extension answers with a table of
# the keys it changes: each answer's keys over the stock theme, in list
# order.
[queries."docs.theme"]
level = "workspace"
combine = "livery.extensions.docs._theme:merge_theme"

# zensical, the site's builder: the docs verbs run it from the
# workspace's environment, and it imports the plugins other extensions
# add to the build from there, so it rides the docs dependency group.
[queries."python.docs-group"]
value = ["zensical>=0.0.50"]
