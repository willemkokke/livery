# The docs extension: the site, its pages, its checks and its CI jobs.
# Read at every mount; its verbs arrive through its plugin.

[extension]
api-version = 1
# Listed in [workspace] extensions.
levels = ["workspace"]
# The footman plugin that carries the site's verbs.
plugin = "livery.extensions.docs"

# The site's title, its description, and where it publishes.
[contract.root.docs.title]
types = ["str"]
doc = "the site's title; the project's name when absent"

[contract.root.docs.description]
types = ["str"]
doc = "the site's one-line description"

[contract.root.docs.publish]
types = ["str"]
values = ["pages", "container", "ssh", "none"]
doc = "where the site publishes; the forge's default when absent: pages on GitHub and GitLab, a container on Gitea"

# The verbs that write a package's pages before the site builds.
[contract.package.docs.generators]
types = ["list"]
doc = "the verbs that write the package's pages: a verb's name, or a table with the system packages it needs"

[contract.package.docs."generators[]"]
types = ["str", "table"]
verb = { types = ["str"], doc = "the verb, a task the package ships" }
requires = { types = ["strs"], doc = "the system packages the verb needs on a docs machine" }

# A package's pages beyond the generated ones.
[contract.package.docs.coverage]
types = ["list"]
doc = "the static coverage reports the package's own tooling writes"

[contract.package.docs."coverage[]"]
types = ["table"]
label = { types = ["str"], doc = "the report's name on the page" }
path = { types = ["str"], doc = "the report's directory, relative to the package" }

[contract.package.docs.extra-css]
types = ["strs"]
doc = "stylesheets for the package's pages, relative to its docs/"

[contract.package.docs.extra-javascript]
types = ["list"]
doc = "scripts for the package's pages: a path, or a table with its attributes"

[contract.package.docs."extra-javascript[]"]
types = ["str", "table"]
path = { types = ["str"], doc = "the script, relative to the package's docs/" }
type = { types = ["str"], doc = "the script element's type" }
defer = { types = ["bool"], doc = "whether the script runs after the page parses" }
async = { types = ["bool"], doc = "whether the script runs as soon as it loads" }

# The cross-references in the sources' docstrings resolve. A removed
# public name runs the check over every source, since an unchanged
# docstring may name what went away.
[checks.docrefs.lint]
run = "livery.extensions.docs._checks:docrefs_run"
narrowing = "none"
inputs = { reads = ["packages/**/src/**/*.py"], widen = "livery.extensions.docs._checks:names_removed" }

# The links in the authored markdown resolve. A removed heading or a
# deleted or moved page runs the check over every page.
[checks.doclinks.lint]
run = "livery.extensions.docs._checks:doclinks_run"
narrowing = "none"
inputs = { reads = ["docs/**/*.md", "packages/**/docs/**/*.md"], on-removal = true, widen = "livery.extensions.docs._checks:headings_removed" }

# Every name a python member exports has a docstring.
[checks.docstrings.lint]
run = "livery.extensions.docs._checks:docstrings_run"
narrowing = "packages"

# The strict site build: the gate point's verdict waits for it.
[ci.jobs.gate.docs]
entries = ["docs.build"]
gates = true
installs = "livery.extensions.docs._contract:docs_requirements"
note = """\
The strict site build: broken links and orphan pages go red here, \
required through the gate context, never inside the local check."""

# The site's deploy, on the merge point: the build, then the publish
# through the seam the root contract names.
[ci.jobs.merge.deploy]
entries = ["docs.build", "docs.publish"]
needs = ["gate"]
fetch = "tags"
token = "job"
installs = "livery.extensions.docs._contract:docs_requirements"
deploy = "livery.extensions.docs._contract:publish_seam"
note = """\
The site's deploy through the contract's seam, on the push alone. The \
release view reads the receipt tags; a shallow tagless clone renders \
its no-tags fallback page instead."""

# The private-members policy the API reference renders: the nearest
# contract that sets one wins.
[slots."docs.members"]
compose = "nearest"
default = "public"
values = ["public", "all"]

# The site's theme: each contribution's keys over the stock theme.
[slots."docs.theme"]
compose = "livery.extensions.docs._site:_merge_theme"
