# Conan: a C or C++ package's recipe, its build into the conan cache,
# and its release to a conan remote or the forge's releases.

[extension]
description = "A C or C++ package's conan recipe: its version stamped, its package built into the conan cache, and its release published to a conan remote or the forge's releases."
api-version = 1
# Conan packages C and C++, so a package that lists conan is a C or C++
# package.
requires = ["cpp"]

# The sync, build and publish steps below run conan, so the lock pins it
# while a package's set holds conan.
[toolroom]
requires = ["conan"]

# The questions about a package this extension answers, from its recipe.
# Its requirement writer writes into the recipe for a sibling that is a
# conan package: one that holds conan and whose recipe names a reference.
# A recipe that names a reference releases the conan package, and the
# release train probes the conan target the registry ladder resolves for
# it; a consumer's recipe releases nothing and answers neither.
[queries]
current-version = "livery.extensions.conan._answers:current_version"
version-files = "livery.extensions.conan._answers:version_files"
requirements = "livery.extensions.conan._answers:requirements"
requirement-writers = "livery.extensions.conan._answers:requirement_writers"
distributions = "livery.extensions.conan._answers:distributions"
registry = "livery.extensions.conan._answers:registry"

# The steps this extension adds to the phases, one per phase, each
# named for the extension. The sync step runs before `uv sync` installs
# a member whose build goes through the cmake-conan provider: conan's
# default profile names a compiler first, or the provider writes one
# that names none. The workspace has one conan home and so one default
# profile, so the step runs once over the workspace while a package's
# set holds conan, however many do.
[phases.sync.conan]
main = "livery.extensions.conan._steps:profile"
extensions = ["conan"]

[phases.stamp.conan]
main = "livery.extensions.conan._steps:stamp"
reads = ["version"]
provides = { changed = "strs" }

# The release's conan package, created in the conan cache on the build
# phase's isolated side; the gate builds on the tree side, where it
# creates none.
[phases.build.conan]
main = "livery.extensions.conan._steps:build"
isolated = true
provides = { dist = "path" }

# A package a job of the run built (prebuilt) is restored into this
# job's conan cache from every host's file the run collected before the
# upload reads the cache, so the upload sends every host's binary.
[phases.publish.conan]
main = "livery.extensions.conan._steps:publish"
reads = ["version", "registry-target", "prebuilt"]
provides = { published = "bool" }

# The conan workspace at the root, written while a package's set holds
# conan: each member resolves its siblings from their sources through it.
[fragments."conanws.yml"]
render = "livery.extensions.conan._package:workspace_file"

# The templates fm new.package creates a C++ package from, built with
# CMake and packaged by conan: a library, and an executable whose
# recipe says application. Their files live under
# content/templates/<name>/ beside this file.
[templates.cpp-library]
doc = "a C++ library built with CMake and packaged by conan"
extensions = ["cmake", "conan"]

[templates.cpp-executable]
doc = "a C++ executable built with CMake and packaged by conan as an application"
extensions = ["cmake", "conan"]
extends = "cpp-library"
