# The coverage extension: each package's coverage policy, the measured
# union the gate job judges it on, the record and the marks that carry
# it across runs, and the site's coverage pages, every one of them in
# the line format the measurers hand their readings over in.
# Read at every mount; its verbs arrive through its plugin, and a
# query's answer is imported when it is asked.

[extension]
api-version = 1
# Listed in [workspace] extensions.
levels = ["workspace"]
# The footman plugin that carries the leg's entry, the union and the
# two verbs a person runs.
plugin = "livery.extensions.coverage"
# Coverage judges what the test extensions measure for it, each through
# its [for.coverage] table: pytest the python suites, cmake the native
# builds. Until a listed extension does, coverage is dormant: it adds
# no CI entry and no judge, its verbs stay, and fm extensions and fm
# doctor say "nothing listed measures" and name what would.
dormant-until = "measures"

# A package's coverage policy: the floor its coverage keeps, how far a
# run may fall below it, and whether anything judges it. A package with
# tests that names no floor is judged at 100.
[contract.package.coverage]
types = ["table"]
doc = "the package's coverage policy"

[contract.package.coverage.floor]
types = ["number", "str"]
doc = "the coverage the package keeps: a percentage, or auto-ratchet for the mark its CI runs record; 100 when absent and the package has tests"

[contract.package.coverage.epsilon]
types = ["number"]
doc = "how far, in percentage points, coverage may fall below the floor; 0.5 when absent"

[contract.package.coverage.required]
types = ["bool"]
doc = "whether anything judges the package's coverage; true when absent, and false gives no verdict, records no mark and takes no floor"

# While docs is listed, the coverage pages of each package whose [docs]
# coverage names an htmlcov report: each file's lines, branches,
# functions and classes as coverage.py counts them. In the docs phase,
# before the site builds, they are drawn from the data a gate run left
# on the machine; a package no data reaches gets no tree, and its page
# states the absence.
[for.docs.phases.docs.coverage]
main = "livery.extensions.coverage._pages:pages_run"

# In the deploy phase, which docs.publish runs on the built site, they
# are drawn again from main's coverage record, the union main's gate
# judged, for the publish to put into the site. A drawing failure fails
# the publish and leaves the verdict as it was.
[for.docs.phases.deploy.coverage]
main = "livery.extensions.coverage._pages:redraw_run"

# Each check leg leaves its measured suites' parts for the leg's one
# write, after the gate and before that write: the suites no record
# can supply run first, measured.
[ci.jobs.gate.check]
entries = ["coverage.leg"]

# The gate job unions every leg's parts with the records' and judges
# the floors before it collects the run's rows: a package below its
# floor stops the job before the verdict and the stamp.
[ci.jobs.gate.gate]
judges = ["coverage.union"]

# The record and the marks are series of the state store: the janitor
# bounds them and fm store.ls lists them. A machine's run of the python
# suites prints this extension's preview: each package's figure beside
# its floor, judging nothing.
[queries]
"store.series" = "livery.extensions.coverage._record:series"
"python.test.preview" = "livery.extensions.coverage._floors:previewer"

# Who reduces the data a measurer leaves to parts, coverage.py's arcs
# say: each listed extension answers with a function of the workspace
# root that returns its reductions, by the measurer's name. A check
# leg asks them for the parts of the suites it ran, and a machine's
# pages and preview for the parts of its last run. One extension
# reduces each measurer; a measurer that writes its parts in its own
# step, a native build's, answers nothing here.
[queries."coverage.measurers"]
level = "workspace"
combine = "livery.extensions.coverage._parts:measurers_by_name"
