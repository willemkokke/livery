# The python package kind: building, versioning, publishing and testing
# a python distribution. The base registers the python kind with this
# extension's code as its backend until the package kinds go.

[extension]
api-version = 1
# Listed in a package's extensions.
levels = ["package"]

# The questions about a package this extension answers. Its requirement
# writer writes into the pyproject for a sibling that holds python.
[queries]
current-version = "livery.extensions.python._answers:current_version"
version-files = "livery.extensions.python._answers:version_files"
requirements = "livery.extensions.python._answers:requirements"
requirement-writers = "livery.extensions.python._answers:requirement_writers"
module-roots = "livery.extensions.python._answers:module_roots"
public-modules = "livery.extensions.python._answers:public_modules"
references = "livery.extensions.python._answers:references"

# Who prints a machine's coverage preview after its suites ran, a query
# a listed extension answers with the function that prints it, given
# the workspace root and the packages the run tested: one answer, the
# nearest. With no answer, a machine's run prints no preview.
[queries."python.test.preview"]
level = "workspace"
combine = "nearest"

# The steps this extension adds to a package's lifecycle phases, one
# per phase, each named for the extension, and the test phase's
# isolated side, which the release train runs once per resolution it
# proves.
[phases.stamp.python]
main = "livery.extensions.python._steps:stamp"
reads = ["version"]
provides = { changed = "strs" }

[phases.build.python]
main = "livery.extensions.python._steps:build"
reads = ["epoch"]
provides = { dist = "path" }

[phases.publish.python]
main = "livery.extensions.python._steps:publish"
reads = ["version", "registry-target"]
provides = { published = "bool" }

# The built wheel in a fresh venv at the engine's resolution, its tests
# run against the installed copy: the release's isolated test, which
# the gate's tree side never runs.
[phases.test.python]
main = "livery.extensions.python._steps:isolated_test"
isolated = true
scope = "package"
extensions = ["python"]
reads = ["resolution", "release-dirs"]
provides = { resolved = "table" }

[phases.verify.python]
main = "livery.extensions.python._steps:verify"
reads = ["version", "tree", "interpreter", "index", "extras"]
provides = { exit-code = "int" }

# What a python package's paths are to it: a change to a test runs that
# test alone, and a change to anything else its suite and its
# dependents'.
[categories]
test = ["tests/**/test_*.py", "tests/**/*_test.py"]
test-support = ["tests/**"]
source = ["src/**"]

# The layering phase's steps over the one parse of the python sources:
# a narrowed run judges the changed sources, and every one when a
# contract, a manifest or a root src/ changed, as the base's layering
# steps do.
#
# No package's source reaches another distribution's private names; the
# root contract's [[python.private-reaches]] lists the reaches allowed.
[phases.layering.private-reaches]
main = "livery.extensions.python._reaches:private_reaches"
inputs = { reads = ["tasks.py", "packages/**/*.py"], widen = "livery.extensions.python._parse:graph_changed", ignores = ["**/*.md", "LICENSE", "**/LICENSE"] }

# A module that imports the runner asks livery.footman.attended(), never
# the terminal: the root's tasks.py and every package's src, apart from
# the runner's own.
[phases.layering.runner-terminal]
main = "livery.extensions.python._terminal:runner_terminal"
inputs = { reads = ["tasks.py", "packages/**/*.py"], widen = "livery.extensions.python._parse:graph_changed", ignores = ["**/*.md", "LICENSE", "**/LICENSE"] }

# What a package's src imports at import time is the standard library,
# a member's, or a distribution its pyproject.toml declares in
# [project.dependencies]; an optional extra's only inside a function; a
# plugin module's also what the program that loads it brings.
[phases.layering.declared-imports]
main = "livery.extensions.python._declared:declared_imports"
inputs = { reads = ["packages/**/*.py"], widen = "livery.extensions.python._parse:graph_changed", ignores = ["**/*.md", "LICENSE", "**/LICENSE"] }

# The root contract's [python] table.
[contract.root.python]
types = ["table"]
doc = "the python extension's settings for the workspace"

[contract.root.python.private-reaches]
types = ["list"]
doc = "each reach into another distribution's private name the private-reaches rule allows, with its reason; an entry no source uses any more refuses"

[contract.root.python."private-reaches[]"]
types = ["table"]
doc = "one allowed reach: the distribution that reaches, the private it reaches, and why"
from = { types = ["str"], doc = "the distribution whose source reaches" }
reaches = { types = ["str"], doc = "the private it reaches, by its dotted path" }
reason = { types = ["str"], doc = "why the reach stays, and the public seam that will replace it" }
