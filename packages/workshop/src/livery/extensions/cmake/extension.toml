# CMake: a CMake project's gate build, configured, compiled and tested
# through ctest, in whatever language the project builds. Requires no
# language: a project lists cmake alone and builds with the compilers
# and libraries the host provides.

[extension]
api-version = 1
# Listed in a package's extensions.
levels = ["package"]

# The tools the gate build runs: cmake configures and builds with the
# Ninja generator, so the lock pins both while a package's set holds
# cmake.
[toolroom]
requires = ["cmake", "ninja"]

# The questions about a package this extension answers: where the gate
# build writes its compilation database, which clang-tidy reads.
[queries]
compile-commands = "livery.extensions.cmake._build:compile_commands"

# While coverage is listed, this extension measures every native suite
# for it: the gate build includes coverage.cmake, each ctest run is read
# by the compiler family's own measurer, and what it read, lines,
# branches, functions and, from llvm-cov, ranges, lands as the
# package's part in the line format under .workshop/coverage/parts/,
# where coverage gathers it. While it is not, the gate build is not
# instrumented and ctest runs alone.
[for.coverage]

# Microsoft's coverage engine measures a build made with MSVC, so the
# lock pins it on the Windows hosts alone, and only while this table
# applies; the .NET SDK it runs on rides as its runtime, there too.
[for.coverage.toolroom]
requires = ["dotnet_coverage@windows"]
