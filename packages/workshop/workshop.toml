# The package contract. Discovery is by this file: a directory under
# packages/ is a package exactly when it carries one.

extensions = ["python"]
name = "livery-workshop"
description = "The livery workshop, a footman plugin serving the whole dev loop."
dev-extras = ["dev"]

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.11.0"

[[depends]]
path = "packages/git"
kind = "runtime"
floor = "0.2.0"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.60.0"

[[depends]]
path = "packages/forge"
kind = "build"
floor = "0.7.0"

[[depends]]
path = "packages/toolroom-store"
kind = "runtime"
floor = "0.4.0"

[[depends]]
path = "packages/strongroom"
kind = "runtime"
floor = "0.4.0"

[docs]
extra-css = ["assets/workshop.css"]
coverage = [
    { label = "Python", path = "htmlcov" },
    { label = "Native (fixture)", path = "tests/fixtures/native-htmlcov" },
]

[coverage]
# The coverage high-water mark the gate enforces, statements and
# branches together; raise it as the suite grows, lower it only
# deliberately. The e2e loop verb's orchestration is proven by the
# live loop against the local forge, not by unit tests, so the
# metered suite counts it uncovered, and the floor allows for it.
floor = 90

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]
