# The package contract. Discovery is by this file: a directory under
# packages/ is a package exactly when it carries one.

type = "python"
name = "livery-workshop"

[verbs]
check = "fm check"
test = "fm test"
build = "uv build --package livery-workshop"

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.6.2"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.52.2"

[[depends]]
path = "packages/forge"
kind = "build"
floor = "0.2.0"

[docs]
extra_css = ["assets/workshop.css"]
generators = ["docs.python-coverage", "docs.task-reference"]
coverage = [
    { label = "Python", path = "htmlcov" },
    { label = "Native (fixture)", path = "tests/fixtures/native-htmlcov" },
]

[qa]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately.
coverage_floor = 87

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]
