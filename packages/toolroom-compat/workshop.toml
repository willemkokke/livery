# Seeded from the template channel (package-python kind) at
# birth; this file is the workspace's own. Edit it directly:
# the template never rewrites it.
# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
type = "python"
name = "toolroom"

[docs]
# The shim's surface is livery.toolroom's; documenting three
# forwarders would document the real thing twice.
api = false

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.6.2"

[release]
# The first release lands at the baseline itself, so the shim
# names the first number past its index twin. It continues the toolroom index line past its last release.
baseline = "0.6.2"

[qa]
# Three forwarding lines; the contract tests are the suite.
coverage-floor = 100

[owners]
users = ["willemkokke"]
teams = []
approvals = 0
