# The basedpyright extension: the type checker, and type completeness as
# its option. Read at every mount; a check's code is imported when the
# check runs.

[extension]
api-version = 1
# Listed in the workspace's list alone: one configuration for every member.
levels = ["workspace"]

# Off unless the workspace lists it, `basedpyright[typecomplete]`.
[options]
typecomplete = "verifies that every package's public API is type-complete"

[checks.basedpyright.typecheck]
run = "livery.extensions.basedpyright._checks:judge_typecheck"
narrowing = "paths"
kinds = ["python"]
tools = ["basedpyright"]
arguments = true
editor-extension = "detachhead.basedpyright"
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", suffixes = [".py", ".pyi"] },
    { category = "test-support", suffixes = [".py", ".pyi"] },
]

# The type checker that answers in the editor is the one this workspace
# configures: the editor's default python language server is off, so it
# adds no second verdict with settings of its own.
[checks.basedpyright.typecheck.fragments]
".vscode/settings.json" = '''
{"python.languageServer": "None"}
'''

[checks.basedpyright.typecomplete]
run = "livery.extensions.basedpyright._checks:judge_typecomplete"
narrowing = "packages"
kinds = ["python"]
tools = ["basedpyright"]
arguments = true
listed-with = "typecomplete"
claims = [{ category = "source", suffixes = [".py", ".pyi"] }]
