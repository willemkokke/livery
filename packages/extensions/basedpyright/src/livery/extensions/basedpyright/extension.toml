# The basedpyright extension: the type checker, and type completeness as
# a step a workspace turns on. The type checker is basedpyright's words,
# warnings as errors; a run that reaches the whole calls it with no
# path, so it reads the files pyrightconfig.json names. Type
# completeness runs one call per public module and reads its report, so
# it is code, imported when it runs.

[extension]
api-version = 1
# Listed in the workspace's list alone: one configuration for every member.
levels = ["workspace"]

[phases.typecheck.basedpyright]
main = ["basedpyright", "--warnings", "{arguments}", "{paths}"]
extensions = ["python"]
tools = ["basedpyright"]
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", suffixes = [".py", ".pyi"] },
    { category = "test-support", suffixes = [".py", ".pyi"] },
]

# The type checker that answers in the editor is the one this workspace
# configures: the editor's default python language server is off, so it
# adds no second verdict with settings of its own.
[phases.typecheck.basedpyright.fragments]
".vscode/settings.json" = '''
{"python.languageServer": "None"}
'''

# The editor extension the rendered recommendations list names.
[queries.editor-extensions]
value = ["detachhead.basedpyright"]

# Off unless the workspace turns it on in its root contract:
# [phases.typecomplete.basedpyright] enabled = true.
[phases.typecomplete.basedpyright]
main = "livery.extensions.basedpyright._checks:judge_typecomplete"
enabled = false
extensions = ["python"]
tools = ["basedpyright"]
claims = [{ category = "source", suffixes = [".py", ".pyi"] }]
