# Seeded from the python-library template at
# birth; this file is the workspace's own. Edit it directly:
# nothing rewrites it.
# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-extensions-basedpyright"
description = "basedpyright as a check of the livery workshop: the type checker, and type completeness as its option."

[[depends]]
path = "packages/workshop"
kind = "runtime"
floor = "0.11.0"

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.12.0"

[coverage]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately.
floor = 100

[[depends]]
path = "packages/footman"
kind = "test"
floor = "0.61.0"

[docs]
# Inside the workshop's entry of the site's Packages tree.
name = "workshop.extensions.basedpyright"

[[depends]]
path = "packages/extensions/cmake"
kind = "test"
floor = "0.0.0"

# The suite mounts a workspace whose packages list conan.
[[depends]]
path = "packages/extensions/conan"
kind = "test"
floor = "0.0.0"

# The suite judges members whose public modules python answers.
[[depends]]
path = "packages/extensions/python"
kind = "test"
floor = "0.0.0"

