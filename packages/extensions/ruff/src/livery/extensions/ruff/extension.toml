# The ruff extension: the formatter, then the linter, over the python
# files they claim. Read at every mount; a check's code is imported when
# the check runs.

[extension]
api-version = 1
# Listed in the workspace's list alone: one configuration for every member.
levels = ["workspace"]

# The kinds whose python files ruff judges are a python package's, and a
# native package's conanfile.py beside clang-format over its sources.
[checks.ruff.format]
run = "livery.extensions.ruff._checks:judge_format"
fix = "livery.extensions.ruff._checks:fix_format"
narrowing = "paths"
kinds = ["python", "cpp-conan"]
tools = ["ruff"]
arguments = true
editor-extension = "charliermarsh.ruff"
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", suffixes = [".py", ".pyi"] },
    { category = "test-support", suffixes = [".py", ".pyi"] },
    { category = "configuration", suffixes = [".py", ".pyi"] },
]

# The editor formats python with ruff, as the gate does.
[checks.ruff.format.fragments]
".vscode/settings.json" = '''
{"[python]": {"editor.defaultFormatter": "charliermarsh.ruff"}}
'''

# Test bodies explain themselves by name and assertion, so the docstring
# rules stop at the tests. An example keeps the layout its page shows:
# ruff judges its names, and nothing of its style.
[checks.ruff.lint]
run = "livery.extensions.ruff._checks:judge_lint"
fix = "livery.extensions.ruff._checks:fix_lint"
narrowing = "paths"
kinds = ["python", "cpp-conan"]
tools = ["ruff"]
arguments = true
editor-extension = "charliermarsh.ruff"
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", ignore = ["D1"], suffixes = [".py", ".pyi"] },
    { category = "example", suffixes = [".py", ".pyi"], ignore = [
        "D", "E", "I", "UP", "B", "SIM", "C4", "RUF", "F401", "F811", "F841",
    ] },
    { category = "test-support", ignore = ["D1"], suffixes = [".py", ".pyi"] },
    { category = "configuration", suffixes = [".py", ".pyi"] },
]
