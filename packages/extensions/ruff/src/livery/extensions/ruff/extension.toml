# The ruff extension: the formatter, then the linter, over the python
# files they claim. Both checks are ruff's words: the workshop selects
# the paths a run reaches, appends the words after -- on the check's
# verb and then the paths, and ruff's exit code is the verdict. A file
# named to ruff follows the configured excludes under --force-exclude,
# as a file ruff finds itself does.

[extension]
api-version = 1
# Listed in the workspace's list alone: one configuration for every member.
levels = ["workspace"]

# Ruff judges a python package's python files, and a conan package's
# recipe, conanfile.py, beside clang-format over its C and C++ sources.
[checks.ruff.format]
judge = ["ruff", "format", "--check", "--force-exclude"]
# Formatting removes no code, so --safe-fix rewrites as --fix does.
fix = ["ruff", "format", "--force-exclude"]
narrowing = "paths"
extensions = ["python", "conan"]
tools = ["ruff"]
arguments = true
editor-extension = "charliermarsh.ruff"
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", suffixes = [".py", ".pyi"] },
    { category = "test-support", suffixes = [".py", ".pyi"] },
    { category = "configuration", suffixes = [".py", ".pyi"] },
]

# The editor formats python with ruff, as the gate does.
[checks.ruff.format.fragments]
".vscode/settings.json" = '''
{"[python]": {"editor.defaultFormatter": "charliermarsh.ruff"}}
'''

# Test bodies explain themselves by name and assertion, so the docstring
# rules stop at the tests. An example keeps the layout its page shows:
# ruff judges its names, and nothing of its style.
[checks.ruff.lint]
judge = ["ruff", "check", "--force-exclude"]
fix = ["ruff", "check", "--fix", "--force-exclude"]
# --safe-fix withholds the rule that deletes code an edit in flight has
# not finished writing: an import added before the code that uses it.
safe-fix = ["ruff", "check", "--fix", "--unfixable=F401", "--force-exclude"]
narrowing = "paths"
extensions = ["python", "conan"]
tools = ["ruff"]
arguments = true
editor-extension = "charliermarsh.ruff"
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", ignore = ["D1"], suffixes = [".py", ".pyi"] },
    { category = "example", suffixes = [".py", ".pyi"], ignore = [
        "D", "E", "I", "UP", "B", "SIM", "C4", "RUF", "F401", "F811", "F841",
    ] },
    { category = "test-support", ignore = ["D1"], suffixes = [".py", ".pyi"] },
    { category = "configuration", suffixes = [".py", ".pyi"] },
]
