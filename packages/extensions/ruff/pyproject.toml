# Seeded from the package-python seeds at
# birth; this file is the workspace's own. Edit it directly:
# nothing rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-extensions-ruff"
version = "0.0.0"
description = "Ruff as a check of the livery workshop: the formatter and the linter, configured by the root ruff.toml."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "livery-toolroom>=0.10.0",
    "livery-workshop>=0.6.0",
]

[project.urls]
Repository = "https://github.com/willemkokke/livery"

# The name a workspace lists in [workspace] extensions, and the package
# whose extension.toml the workshop mounts it from. Nothing else: the
# extension adds no verb of its own, and nothing activates by being
# installed.
[project.entry-points."workshop.extensions"]
ruff = "livery.extensions.ruff"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is livery.extensions.ruff and
# there is no livery/__init__.py anywhere in this repository.
module-name = "livery.extensions.ruff"
namespace = true
