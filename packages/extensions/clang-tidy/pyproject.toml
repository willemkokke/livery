# Seeded from the package-python seeds at
# birth; this file is the workspace's own. Edit it directly:
# nothing rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-extensions-clang-tidy"
version = "0.0.0"
description = "clang-tidy as a check of the livery workshop: each cpp package's sources, judged by its own .clang-tidy over its build's compilation database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

dependencies = [
    "livery-footman>=0.56.0",
    "livery-toolroom>=0.9.0",
    "livery-workshop>=0.5.0",
]

[project.urls]
Repository = "https://github.com/willemkokke/livery"

# The name a workspace lists in [workspace] extensions, and the module
# whose data the workshop mounts it from. Nothing else: the extension
# adds no verb of its own, and nothing activates by being installed.
[project.entry-points."workshop.extensions"]
clang-tidy = "livery.extensions.clang.tidy._extension"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is livery.extensions.clang.tidy and
# there is no livery/__init__.py anywhere in this repository.
module-name = "livery.extensions.clang.tidy"
namespace = true
