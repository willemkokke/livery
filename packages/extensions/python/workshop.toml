# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-extensions-python"
description = "Python distributions, as an extension of the livery workshop: each package's version stamped, its wheel and sdist built, published and verified, its suite run against the installed wheel, and the layering rules over the python sources."

[[depends]]
path = "packages/workshop"
kind = "runtime"
floor = "0.10.0"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.60.0"

[[depends]]
path = "packages/forge"
kind = "runtime"
floor = "0.7.0"

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.11.0"

[coverage]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately. Two lines of `_backend.py`
# cannot run: in `module_for`, the return after the loop, since the
# loop breaks only before it has named a module part; and in
# `publish_wheels`, the return after the refusal, which raises. The
# CI union reaches every other line.
floor = 99.5

[docs]
# Inside the workshop's entry of the site's Packages tree.
name = "workshop.extensions.python"

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]
