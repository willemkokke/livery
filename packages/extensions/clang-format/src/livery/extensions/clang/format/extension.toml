# The clang-format extension: one style for every native member, judged
# per package. The step is clang-format's words, called from the
# package's directory on the package's files a run reaches, so each
# package's own .clang-format sets the style.

[extension]
description = "The C and C++ formatter clang-format, judging each C or C++ package against the style in its .clang-format; under --fix it rewrites the files."
api-version = 1

# The packages that carry C or C++.
[phases.format.clang-format]
main = ["clang_format", "--dry-run", "--Werror", "{arguments}", "{paths}"]
fix = ["clang_format", "-i", "{arguments}", "{paths}"]
scope = "package"
extensions = ["cpp"]
tools = ["clang_format"]
claims = [
    { category = "source", suffixes = [".cpp", ".cc", ".cxx", ".c", ".hpp", ".h", ".hxx"] },
    { category = "test", suffixes = [".cpp", ".cc", ".cxx", ".c", ".hpp", ".h", ".hxx"] },
    { category = "test-support", suffixes = [".cpp", ".cc", ".cxx", ".c", ".hpp", ".h", ".hxx"] },
]

# The style each C or C++ package carries; a deeper file with
# `BasedOnStyle: InheritParentConfig` adds that directory's own lines.
[phases.format.clang-format.fragments.".clang-format"]
extensions = ["cpp"]
text = '''
# Rendered by the fragment engine for each C or C++ package; the gate
# keeps it matching its render. A file deeper in the tree with
# `BasedOnStyle: InheritParentConfig` carries this package's own lines.
BasedOnStyle: LLVM
IndentWidth: 4
ColumnLimit: 88
PointerAlignment: Left
'''
