# The changelog extension: each package's CHANGELOG.md, written by
# git-cliff from the commits since the package's last release. The
# extension answers the release-notes query with NOTES, imported when
# the release train first asks for an entry; each package's cliff.toml
# is this extension's per-package content.

[extension]
description = "Each package's CHANGELOG.md: at each release, git-cliff writes the entry from the commits since the package's last release tag, as the package's cliff.toml says."
api-version = 1

# The release notes' writer, which the release train asks for each
# release's entry.
[queries]
release-notes = "livery.extensions.changelog._cliff:notes"

[toolroom]
# git-cliff writes every entry, so the lock pins it and the entries a
# release writes do not depend on the machine.
requires = ["git_cliff"]
