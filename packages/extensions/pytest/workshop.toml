# Seeded from the python-library template at
# birth; this file is the workspace's own. Edit it directly:
# nothing rewrites it.
# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-extensions-pytest"
description = "pytest as a check of the livery workshop: each python package's suite and documentation examples, configured by the root pytest.toml and .coveragerc."

[[depends]]
path = "packages/workshop"
kind = "runtime"
floor = "0.11.0"

[coverage]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately.
floor = 100

[[depends]]
path = "packages/footman"
kind = "test"
floor = "0.61.0"

[docs]
# Inside the workshop's entry of the site's Packages tree.
name = "workshop.extensions.pytest"

[[depends]]
path = "packages/git"
kind = "test"
floor = "0.3.0"

[[depends]]
path = "packages/extensions/cmake"
kind = "test"
floor = "0.0.0"

[[depends]]
path = "packages/extensions/docs"
kind = "test"
floor = "0.0.0"

[[depends]]
path = "packages/extensions/coverage"
kind = "test"
floor = "0.0.0"

# The suite runs the suites and the examples through python's runners.
[[depends]]
path = "packages/extensions/python"
kind = "test"
floor = "0.0.0"

