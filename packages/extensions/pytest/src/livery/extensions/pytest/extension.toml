# The pytest extension: each python package's suite, and its
# documentation examples. Read at every mount; a step's code is imported
# when the step runs.

[extension]
api-version = 1

# pytest is the record's tool in the store, for the typed handle the
# runner calls, and its venv copy is the one that imports the project's
# environment. A package's tests measure its source, so a source change
# is one the test step reads, and runs the suite for. The suite runs in
# the workspace's venv, so the step serves the test phase's tree side.
[phases.test.pytest]
main = "livery.extensions.pytest._steps:judge_test"
isolated = false
extensions = ["python"]
tools = ["pytest"]
flags = ["point"]
claims = [
    { category = "test" },
    { category = "test-support" },
    { category = "source", suffixes = [".py", ".pyi"] },
]

[phases.test.pytest.options.parallel]
type = "bool"
default = true
doc = "run the package's suite across cores; false runs it under -n 0"

[phases.examples.pytest]
main = "livery.extensions.pytest._steps:judge_examples"
extensions = ["python"]
tools = ["pytest"]
claims = [{ category = "example", suffixes = [".py", ".pyi"] }]

# pytest imports the project's environment, so it lives in the venv:
# pytest 9 for the pytest.toml it reads, and xdist for -n auto.
[queries."python.dev-group"]
value = ["pytest>=9.0", "pytest-xdist>=3.6"]

# The options the rendered pytest.toml hands every run.
[queries."python.test.addopts"]
value = ["-q", "-n auto", "--dist=worksteal", "--import-mode=importlib"]

# While coverage is listed, this extension measures every python suite
# for it: the test step runs the suites metered, the sync writes the
# root .coveragerc and the lines that ignore the meter's data, both
# shipped under content/for/coverage/, and the arcs coverage.py records
# are reduced to the line format coverage reads: on each check leg,
# once for every suite the leg ran, and on a machine for its pages and
# its preview.
[for.coverage.queries]
"coverage.measurers" = "livery.extensions.pytest._coverage:measurers"

# coverage 7.13 for the .pth it installs, which starts the meter in
# every python the tests start once the runner arms it and imports
# nothing otherwise, and pytest-cov for a machine's measured run.
[for.coverage.queries."python.dev-group"]
value = ["pytest-cov>=5", "coverage>=7.13"]
