# Seeded from the python-library template at
# birth; this file is the workspace's own. Edit it directly:
# nothing rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-extensions-pytest"
version = "0.0.0"
description = "pytest as a check of the livery workshop: each python package's suite and documentation examples, configured by the root pytest.toml and .coveragerc."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

dependencies = [
    "livery-workshop>=0.6.0",
]

[project.optional-dependencies]
# coverage.py, which this extension imports inside the functions that
# measure the suites for the coverage extension. While coverage is
# listed, this extension's own lines of the workspace's dev group
# install it.
coverage = ["coverage>=7.13"]
# What this package's own suite needs beyond its dependencies: the cmake
# extension, a distribution of its own, which the suite's workspaces list
# as data. The release's isolated leg installs the wheel with this
# extra, so the suite finds cmake installed there too.
test = ["livery-extensions-cmake>=0.0.0"]

[project.urls]
Repository = "https://github.com/willemkokke/livery"

# The name a workspace lists in [workspace] extensions, and the package
# whose extension.toml the workshop mounts it from. Nothing else: the
# extension adds no verb of its own, and nothing activates by being
# installed.
[project.entry-points."workshop.extensions"]
pytest = "livery.extensions.pytest"

# Every pytest this venv starts carries the context plugin: in a metered
# CI leg it names each test's coverage context by node id, so the leg
# splits one run's data per suite; elsewhere it is quiet.
[project.entry-points.pytest11]
livery-extensions-pytest-contexts = "livery.extensions.pytest._contexts"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is livery.extensions.pytest and
# there is no livery/__init__.py anywhere in this repository.
module-name = "livery.extensions.pytest"
namespace = true
