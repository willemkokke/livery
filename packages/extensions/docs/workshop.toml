# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-extensions-docs"
description = "The livery workshop's documentation site: its verbs build, serve and publish it from the workspace's docs/ and each package's docs/, and a lint step judges the links in the authored pages."

[[depends]]
path = "packages/workshop"
kind = "runtime"
floor = "0.10.0"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.60.0"

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.11.0"

[[depends]]
path = "packages/git"
kind = "runtime"
floor = "0.2.0"

# The suite publishes through the forge's fake.
[[depends]]
path = "packages/forge"
kind = "test"
floor = "0.7.0"

# The suite draws the coverage pages with coverage's code.
[[depends]]
path = "packages/extensions/coverage"
kind = "test"
floor = "0.0.0"

# The suite reads the name of every installed extension that composes
# something in a package, nanobind's among them.
[[depends]]
path = "packages/extensions/nanobind"
kind = "test"
floor = "0.0.0"

[coverage]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately. The measured value of the
# suite that moved here with the extension.
floor = 91

[docs]
# Inside the workshop's entry of the site's Packages tree.
name = "workshop.extensions.docs"

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]
