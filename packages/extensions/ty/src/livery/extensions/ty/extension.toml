# The ty extension: the type checker over every platform at once. The
# step is ty's words over what ty.toml includes, whatever a run reaches:
# a run costs seconds, and the file pins every platform at once.

[extension]
api-version = 1
# Listed in the workspace's list alone: one configuration for every member.
levels = ["workspace"]

[phases.typecheck.ty]
main = ["ty", "check", "{arguments}"]
extensions = ["python"]
tools = ["ty"]
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", suffixes = [".py", ".pyi"] },
    { category = "test-support", suffixes = [".py", ".pyi"] },
]

# The editor extension the rendered recommendations list names.
[queries.editor-extensions]
value = ["astral-sh.ty"]
