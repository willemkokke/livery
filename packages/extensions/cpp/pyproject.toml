# The package's own: edit it directly, nothing rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-extensions-cpp"
version = "0.0.0"
description = "C and C++ as languages, as an extension of the livery workshop: which of a package's files are sources, tests and test support, and the compilers the host must provide."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    # The base, whose queries the extension answers.
    "livery-workshop>=0.10.0",
]

[project.optional-dependencies]
# The members this package's tests need beyond its dependencies, one
# for each test edge of its workshop.toml, at the edge's floor.
test = ["livery-footman>=0.60.0"]

[project.urls]
Repository = "https://github.com/willemkokke/livery"

# The name a package lists in its extensions, and the package whose
# extension.toml the workshop mounts it from. Nothing else: the
# extension adds no verb of its own, and nothing activates by being
# installed.
[project.entry-points."workshop.extensions"]
cpp = "livery.extensions.cpp"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is livery.extensions.cpp,
# which has no __init__.py, and there is no livery/__init__.py anywhere
# in this repository. The flag lets uv ship a package with no
# __init__.py.
module-name = "livery.extensions.cpp"
namespace = true
