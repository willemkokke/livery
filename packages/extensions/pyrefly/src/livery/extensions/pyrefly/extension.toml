# The pyrefly extension: the type checker over every platform at once. The
# step is pyrefly's words over what pyrefly.toml includes, whatever a run
# reaches: a run costs seconds, and the file pins every platform at once.

[extension]
description = "The type checker pyrefly, over every platform at once, on the python files the root pyrefly.toml includes."
api-version = 1

[phases.typecheck.pyrefly]
main = ["pyrefly", "check", "{arguments}"]
extensions = ["python"]
tools = ["pyrefly"]
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", suffixes = [".py", ".pyi"] },
    { category = "test-support", suffixes = [".py", ".pyi"] },
]
