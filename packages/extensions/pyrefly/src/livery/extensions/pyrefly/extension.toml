# The pyrefly extension: the type checker over every platform at once. Read at
# every mount; a check's code is imported when the check runs.

[extension]
api-version = 1
# Listed in the workspace's list alone: one configuration for every member.
levels = ["workspace"]

[checks.pyrefly.typecheck]
run = "livery.extensions.pyrefly._checks:judge_typecheck"
kinds = ["python"]
tools = ["pyrefly"]
arguments = true
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", suffixes = [".py", ".pyi"] },
    { category = "test-support", suffixes = [".py", ".pyi"] },
]
