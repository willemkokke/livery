# The package's own: edit it directly, nothing rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-extensions-nanobind"
version = "0.0.0"
description = "A python package whose extension module is C++, bound through nanobind, as an extension of the livery workshop: its platform wheels and sdist built for a release, on the runners the package names."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "livery-footman>=0.60.0",
    # Every git call goes through livery.git: the epoch of the release
    # a wheels leg builds.
    "livery-git>=0.2.0",
    # The store's uv, through its toolroom handle, builds the sdist and
    # runs cibuildwheel, so the version is the one the checkout's lock
    # pins.
    "livery-toolroom>=0.11.0",
    # The base, and the python, cpp and conan extensions nanobind
    # requires, which the workshop's wheel ships.
    "livery-workshop>=0.10.0",
]

[project.optional-dependencies]
# The members this package's tests need beyond its dependencies, one
# for each test edge of its workshop.toml, at the edge's floor.
test = ["livery-forge>=0.7.0", "livery-toolroom-store>=0.4.0"]

[project.urls]
Repository = "https://github.com/willemkokke/livery"

# The verb each leg of the release's wheels job runs, which the
# extension's plugin mounts while a package's set holds nanobind.
[project.entry-points."footman.tasks"]
"livery.extensions.nanobind" = "livery.extensions.nanobind._tasks"

# The name a package lists in its extensions, and the package whose
# extension.toml the workshop mounts it from.
[project.entry-points."workshop.extensions"]
nanobind = "livery.extensions.nanobind"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is livery.extensions.nanobind,
# which has no __init__.py, and there is no livery/__init__.py anywhere
# in this repository. The flag lets uv ship a package with no
# __init__.py.
module-name = "livery.extensions.nanobind"
namespace = true
