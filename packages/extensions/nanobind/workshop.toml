# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-extensions-nanobind"
description = "A python package whose extension module is C++, bound through nanobind, as an extension of the livery workshop: its platform wheels and sdist built for a release, on the runners the package names."

[[depends]]
path = "packages/workshop"
kind = "runtime"
floor = "0.10.0"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.60.0"

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.11.0"

[[depends]]
path = "packages/git"
kind = "runtime"
floor = "0.2.0"

[[depends]]
path = "packages/extensions/conan"
kind = "runtime"
floor = "0.0.0"

[[depends]]
path = "packages/extensions/cpp"
kind = "runtime"
floor = "0.0.0"

[[depends]]
path = "packages/extensions/python"
kind = "runtime"
floor = "0.0.0"

# The suite publishes through the forge's fake.
[[depends]]
path = "packages/forge"
kind = "test"
floor = "0.7.0"

# The suite stands an empty tool store in for the machine's.
[[depends]]
path = "packages/toolroom-store"
kind = "test"
floor = "0.4.0"

[coverage]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately. The build container's
# Linux branch runs on the Linux leg alone, so a run on any other
# machine reads below the CI union, which reaches every line; the
# floor sits a little under the union's 100.
floor = 99.5

[docs]
# Inside the workshop's entry of the site's Packages tree.
name = "workshop.extensions.nanobind"

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]
