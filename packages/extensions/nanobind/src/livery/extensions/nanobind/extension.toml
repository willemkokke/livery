# nanobind: a python package whose extension module is C++, bound to
# python through nanobind and built into one wheel per platform. A
# package lists nanobind and holds what it requires beside it: python
# for the distribution, cpp for the extension module's sources, and
# conan for the provider that resolves their dependencies, which the
# package consumes without being a conan package. What nanobind adds is
# the release's stamp across both manifests, the build of the wheels and
# the sdist, the deletion of the steps of python and conan that would
# stamp, build or release something else, the tools the build runs, the
# release's wheels job, the key that names the runners its legs run on,
# and the answer naming the members the job builds.

[extension]
description = "A python package whose extension module is C++, bound through nanobind: its platform wheels and sdist built for a release, on the runners the package names in [nanobind] wheel-platforms."
api-version = 1
# The footman plugin that carries the verb the wheels job runs.
plugin = "livery.extensions.nanobind"
# The distribution, the extension module's language, and the provider
# that resolves the module's C++ dependencies.
requires = ["python", "cpp", "conan"]

# The tools the extension module builds with: cmake, the Ninja
# generator, and the cmake-conan provider, which installs its C++
# dependencies through conan. The lock pins them while a package's set
# holds nanobind; nanobind and scikit-build-core arrive through the
# package's own build-system requires, never the machine.
[toolroom]
requires = ["cmake", "ninja", "conan", "cmake_conan"]

# The members the wheels job builds before the wave: every package that
# holds nanobind, and every package that releases a conan package. The
# release train publishes what the run collected for them, and the
# entry installs the ones uv installs after the tools.
[queries]
job-built-members = "livery.extensions.nanobind._ci:job_built_members"
# The recipe, which the stamp below raises floors in: python answers
# with the pyproject and the modules, and conan answers no file for a
# recipe that names no version.
version-files = "livery.extensions.nanobind._stamp:version_files"

# An editor's configure of the extension module asks the venv's
# interpreter where nanobind's cmake directory is, so the venv carries
# nanobind beside the build's own isolated copy.
[queries."python.dev-group"]
value = ["nanobind>=2.7"]

# The release's stamp: the version into pyproject.toml and every
# __version__, and each floor on a member released with the package, in
# the pyproject and in the recipe, through python's and conan's entry
# modules. One step of a package reports the files the phase changed,
# so python's and conan's stamp steps are deleted in every package
# whose set holds nanobind.
[phases.stamp.nanobind]
main = "livery.extensions.nanobind._stamp:stamp"
reads = ["version", "floors"]
provides = { changed = "strs" }

[phases.stamp.nanobind.deletes]
"python:stamp.python" = "this step writes the version and the pyproject's floors through python's stamp, and raises the recipe's floors too"
"conan:stamp.conan" = "the package's recipe names the requirements its extension module builds against and no version, and this step raises its floors through conan"

# The release's build: cibuildwheel builds and repairs the platform
# wheels, and uv the sdist, on the build phase's isolated side. The
# steps python and conan add that would build or release something
# else are deleted in every package whose set holds nanobind; a package
# whose set does not hold it runs them as before.
[phases.build.nanobind]
main = "livery.extensions.nanobind._build:build"
isolated = true
reads = ["epoch"]
provides = { dist = "path" }

[phases.build.nanobind.deletes]
"python:build.python" = "uv build writes a pure wheel, and the package's wheels are platform wheels, which this step builds with the sdist"
"conan:build.conan" = "the package's recipe creates no conan package: the provider installs its requirements while the wheels build"
"conan:publish.conan" = "the package releases its wheels, never a conan package"

# Where a package's platform wheels build.
[contract.package.nanobind]
types = ["table"]
doc = "how the package's platform wheels build"

[contract.package.nanobind.wheel-platforms]
types = ["strs"]
doc = "the runner labels that build the package's platform wheels, one leg of the release's wheels job each; required in a package that holds nanobind"

# Every platform's wheels, built before the wave on each runner label
# the packages that hold nanobind name, and handed to the publish job
# as one artifact per leg. The leg also creates each conan package of
# the release and saves its cache beside the wheels. A workspace whose
# packages name no label renders no wheels job.
[ci.jobs.release.wheels]
entries = ["nanobind.wheels"]
labels = "livery.extensions.nanobind._ci:wheel_runners"
fetch = "full"
publishes = "wheels"
paths = ["packages/*/dist/*", "packages/*/*/dist/*"]
conan-cache = true
note = """\
Every platform's wheels, built before the wave: the matrix feeds the \
publish job through artifacts, so one release ships the complete set."""

# The wave publishes what the legs built: the publish job waits for the
# wheels job and collects its artifact before it enters.
[ci.jobs.release.publish]
collects = "wheels"
needs = ["wheels"]

# The template fm new.package.nanobind-module creates a package from: python's
# library with the extension module, its build and the conan recipe
# that names its C++ requirements. Its files live under
# content/templates/nanobind-module/ beside this file.
[templates.nanobind-module]
doc = "a python package whose extension module is C++, bound through nanobind and built into platform wheels"
extensions = ["nanobind"]
extends = "python-library"
# Its pyproject.toml is its own and declares no script, so it takes no
# --command.
fixes = { command = "" }
