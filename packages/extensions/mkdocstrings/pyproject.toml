# The package's own: edit it directly, nothing rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-extensions-mkdocstrings"
version = "0.0.0"
description = "The python API reference on the livery workshop's docs site, a page per module, and the lint steps that judge the docstrings it publishes and the cross-references in them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    # The docs extension this one requires: its pages and its tables are
    # the docs extension's site's.
    "livery-extensions-docs>=0.0.0",
    "livery-footman>=0.61.0",
    "livery-workshop>=0.11.0",
]

[project.optional-dependencies]
# The reference check reads the sources with griffe, which griffelib
# ships, imported inside the function that reads them. A workspace that
# lists mkdocstrings gets griffe through mkdocstrings-python, the
# extension's line in the docs dependency group, so the wheel's runtime
# needs none. This package's suite runs the check, so the release's
# isolated legs install the wheel with this extra. The floor is the
# lock's. The suite also reads the module roots python answers, at the
# floor of its test edge.
test = ["griffelib>=2.2.0", "livery-extensions-python>=0.0.0"]

[project.urls]
Repository = "https://github.com/willemkokke/livery"

# The name a workspace lists in [workspace] extensions, and the package
# whose extension.toml the workshop mounts it from. Nothing else: the
# extension adds no verb of its own, and nothing activates by being
# installed.
[project.entry-points."workshop.extensions"]
mkdocstrings = "livery.extensions.mkdocstrings"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is
# livery.extensions.mkdocstrings, which has no __init__.py, and there is
# no livery/__init__.py anywhere in this repository. The flag lets uv
# ship a package with no __init__.py.
module-name = "livery.extensions.mkdocstrings"
namespace = true
