# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-extensions-mkdocstrings"
# The suite reads sources with griffe, which the test extra installs.
dev-extras = ["test"]
description = "The python API reference on the livery workshop's docs site, a page per module, and the lint steps that judge the docstrings it publishes and the cross-references in them."

[[depends]]
path = "packages/workshop"
kind = "runtime"
floor = "0.11.0"

# The docs extension this one requires.
[[depends]]
path = "packages/extensions/docs"
kind = "runtime"
floor = "0.0.0"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.61.0"

# The suite reads the module roots python answers for a package.
[[depends]]
path = "packages/extensions/python"
kind = "test"
floor = "0.0.0"

[coverage]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately.
floor = 100

[docs]
# Inside the workshop's entry of the site's Packages tree.
name = "workshop.extensions.mkdocstrings"

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]
