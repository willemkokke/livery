# The package's own: edit it directly, nothing rewrites it.
[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-extensions-conan"
version = "0.0.0"
description = "A C or C++ package's conan recipe, as an extension of the livery workshop: its version stamped, its package built into the conan cache, and its release published to a conan remote, a folder or the forge's releases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    # The cpp extension conan requires: a conan package is C or C++.
    "livery-extensions-cpp>=0.0.0",
    "livery-footman>=0.61.0",
    # The forge's releases: the route a conan package takes on a forge
    # that hosts no conan registry, its saved caches attached to the
    # member's own release.
    "livery-forge>=0.8.0",
    # The store's conan, through its toolroom handle, so the version is
    # the one the checkout's lock pins.
    "livery-toolroom>=0.12.0",
    # The store's host keys, which name each host's saved cache.
    "livery-toolroom-store>=0.5.0",
    # The base.
    "livery-workshop>=0.11.0",
]

[project.optional-dependencies]
# The members this package's tests need beyond its dependencies, one
# for each test edge of its workshop.toml, at the edge's floor.
test = ["livery-git>=0.3.0"]

[project.urls]
Repository = "https://github.com/willemkokke/livery"

# The name a package lists in its extensions, and the package whose
# extension.toml the workshop mounts it from. Nothing else: the
# extension adds no verb of its own, and nothing activates by being
# installed.
[project.entry-points."workshop.extensions"]
conan = "livery.extensions.conan"

[tool.uv.build-backend]
# The importable package is livery.extensions.conan, its entry module
# the root's __init__.py, which serves the names an extension that
# requires conan reads; livery and livery.extensions are PEP 420
# namespaces with no __init__.py.
module-name = "livery.extensions.conan"
