# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-extensions-conan"
description = "A C or C++ package's conan recipe, as an extension of the livery workshop: its version stamped, its package built into the conan cache, and its release published to a conan remote, a folder or the forge's releases."

[[depends]]
path = "packages/workshop"
kind = "runtime"
floor = "0.10.0"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.60.0"

[[depends]]
path = "packages/forge"
kind = "runtime"
floor = "0.7.0"

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.11.0"

[[depends]]
path = "packages/toolroom-store"
kind = "runtime"
floor = "0.4.0"

[[depends]]
path = "packages/extensions/cpp"
kind = "runtime"
floor = "0.0.0"

# The suite reads what a change touched through livery.git.
[[depends]]
path = "packages/git"
kind = "test"
floor = "0.2.0"

[coverage]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately.
floor = 100

[docs]
# Inside the workshop's entry of the site's Packages tree.
name = "workshop.extensions.conan"

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]
