# Seeded from the python-library template at
# birth; this file is the workspace's own. Edit it directly:
# nothing rewrites it.
# The package contract: everything the workshop knows about this
# package it learns here. Declare dependencies on other workspace
# members as [[depends]] edges with a kind and a floor.
# The extensions this package is composed of.
extensions = ["python"]
name = "livery-extensions-cmake"
description = "CMake as an extension of the livery workshop: a package's gate build, configured and compiled with Ninja, its tests run through ctest, and its native suites measured for coverage."

[[depends]]
path = "packages/workshop"
kind = "runtime"
floor = "0.10.0"

[[depends]]
path = "packages/footman"
kind = "runtime"
floor = "0.60.0"

[[depends]]
path = "packages/toolroom"
kind = "runtime"
floor = "0.11.0"

[[depends]]
path = "packages/git"
kind = "runtime"
floor = "0.2.0"

# The suite judges the native parts and floors with coverage's code.
[[depends]]
path = "packages/extensions/coverage"
kind = "test"
floor = "0.0.0"

# The suite mounts a workspace whose packages list nanobind.
[[depends]]
path = "packages/extensions/nanobind"
kind = "test"
floor = "0.0.0"

# The suite creates packages from conan's cpp-package template.
[[depends]]
path = "packages/extensions/conan"
kind = "test"
floor = "0.0.0"

[coverage]
# The coverage high-water mark the gate enforces; raise it as the
# suite grows, lower it only deliberately. The measured value of the
# suite that moved here with the extension; the MSVC measurer's armed
# test runs on Windows alone.
floor = 86.5

[docs]
# Inside the workshop's entry of the site's Packages tree.
name = "workshop.extensions.cmake"

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]
