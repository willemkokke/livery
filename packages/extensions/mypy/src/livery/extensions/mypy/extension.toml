# The mypy extension: the type checker, once per platform, over the python
# files it claims. The check is mypy's words: mypy has no all-platforms
# mode, so the matrix calls it for linux, darwin and win32 in parallel,
# each with a cache of its own, since mypy's SQLite cache takes one
# writer. A run that reaches the whole calls mypy with no path, so it
# reads the files mypy.ini names.

[extension]
api-version = 1
# Listed in the workspace's list alone: one configuration for every member.
levels = ["workspace"]

[checks.mypy.typecheck]
judge = ["mypy", "--platform={platform}", "--cache-dir={cache}/{platform}"]
matrix = { platform = ["linux", "darwin", "win32"] }
narrowing = "paths"
extensions = ["python"]
tools = ["mypy"]
arguments = true
claims = [
    { category = "source", suffixes = [".py", ".pyi"] },
    { category = "test", suffixes = [".py", ".pyi"] },
    { category = "test-support", suffixes = [".py", ".pyi"] },
]

# mypy reads the members' own stubs from the venv, so it rides the dev
# group beside the store's copy.
[contributions]
"python.dev-group" = ["mypy>=1.14"]
