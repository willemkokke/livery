# The local forge containers the backends are developed against.
# Ships inside livery-forge; `fm forge.dev.up` starts and seeds them,
# and the seeded credentials land in .forge.dev.env (gitignored) at
# the workspace root, which live test runs read. The project name is
# pinned here so where this file lives never changes which containers
# it addresses.
name: livery-forge-dev

services:
  gitea:
    # The 1.28 development line: the interface's floor, and the first
    # line with run cancellation (cancel and force-cancel). Pinned by
    # digest to a validated nightly build until 1.28 ships as a
    # release tag: the moving :nightly broke the conformance legs when
    # a later build stopped listing completed action tasks (release
    # legs run 33411879570), so the pin moves only after the legs
    # prove a newer build.
    image: docker.gitea.com/gitea@sha256:026a91271ad2b154c139f84ee587205f7a0776b1ca43709bddc7c29bc2b22664
    profiles: [gitea]
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      # The service name, not localhost: held conformance jobs poll
      # the API from inside the runner container, and gitea derives
      # the jobs' GITHUB_API_URL from this value. Host-side clients
      # still reach the published port on localhost either way.
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__actions__ENABLED: "true"
      # The seeded org creates repositories through the API only.
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 2s
      retries: 90

  act_runner:
    # Pinned by digest beside the server, for the same reason.
    image: docker.gitea.com/act_runner@sha256:2f54d4df2a1e1b69c4b44db53c70dbd57043594b7f48bcf2e685c3b5bdb738e0
    profiles: [gitea-runner]
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      # Minted by `fm forge.dev seed` and passed through by the task;
      # never written into this file.
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: livery-dev
      # Host mode: jobs run inside the runner container itself. The
      # conformance workflows are shell one-liners, so no Docker socket
      # is mounted.
      GITEA_RUNNER_LABELS: ubuntu-latest:host,linux:host
      CONFIG_FILE: /runner-config.yaml
    configs:
      - source: runner-config
        target: /runner-config.yaml
    volumes:
      - runner-data:/data

  gitlab:
    # The image is architecture-dependent: GitLab ships no official
    # arm64 container, but it does ship official arm64 omnibus
    # packages, which the community image wraps. `fm forge.dev.up`
    # detects the machine and sets GITLAB_IMAGE (an explicit
    # value in the environment wins):
    #   amd64: gitlab/gitlab-ce (official)
    #   arm64: yrzr/gitlab-ce-arm64v8 (official omnibus, community wrap)
    # Long-lived: started once and kept, minutes to become healthy.
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce:latest}
    profiles: [gitlab]
    shm_size: 512m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = 'livery-dev-password'
        prometheus_monitoring['enable'] = false
    ports:
      - "8929:8929"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8929/-/readiness"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10m

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    profiles: [gitlab-runner]
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner

configs:
  runner-config:
    # Held conformance runs occupy a slot each until released or
    # cancelled, so one-job capacity would deadlock the suite.
    content: |
      runner:
        capacity: 8

volumes:
  gitea-data:
  runner-data:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  gitlab-runner-config:
