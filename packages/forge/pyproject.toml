[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "livery-forge"
version = "0.4.0"
description = "One interface to GitHub, Gitea, and GitLab — the livery ecosystem's forge."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Sealed-box encryption for GitHub CI secrets: turns the ci_secrets
# capability on for livery.forge.api.GithubForge.
github-secrets = ["pynacl>=1.5"]
# The suite drives the dev plugin, the one part of this package that
# reaches for the runner and the tool handles. Never runtime
# dependencies: livery.forge is stdlib-only at import time, and the
# plugin loads only through footman's own plugin().
test = [
    "livery-footman>=0.53.0",
    "livery-toolroom>=0.7.0",
]

[project.entry-points."footman.tasks"]
# The dev-container tasks (livery.forge._dev). The module imports
# footman, which is not a dependency: the only loader is footman's own
# plugin(), so footman is present by construction.
"livery.forge" = "livery.forge._dev"

# A project that depends on livery-forge directly gets the dev-container
# verbs through footman's project rung.
[project.entry-points."footman.builtin"]
"livery.forge" = "livery.forge._dev"

# The tools the dev verbs need, as a data module the workshop reads
# without importing the verbs.
[project.entry-points."workshop.tools"]
"livery.forge" = "livery.forge._dev_tools:TOOLS"

[project.urls]
Repository = "https://github.com/willemkokke/livery"

[tool.uv.build-backend]
# PEP 420 namespace: the importable package is livery.forge and there is
# no livery/__init__.py anywhere in this repository.
module-name = "livery.forge"
# The root is a namespace too: its public names live in livery.forge.api.
namespace = true
