# The package contract. Discovery is by this file: a directory under
# packages/ is a package exactly when it carries one.

kind = "python"
name = "livery-forge"
description = "One interface to GitHub, Gitea, and GitLab — the livery ecosystem's forge."
dev-extras = ["github-secrets"]

# No [[depends]]: livery.forge is stdlib-only at runtime, and the root
# contracts test enforces it.

[qa]
# The coverage high-water mark the gate enforces, statements and
# branches together; raise it as the suite grows, lower it only
# deliberately.
coverage-floor = 87

# Who reviews this package; the codeowners file renders from
# these declarations.
[owners]
users = ["willemkokke"]

[docs]
generators = ["docs.task-reference"]
