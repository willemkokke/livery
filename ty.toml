# Written by `fm sync` from the ty extension; the gate keeps it
# matching. Edit inside the region at the end, which is the repository's
# own; an edit anywhere else is drift.
#
# The scope is the packages themselves; the tests are read as consumer
# code by the type checkers that narrow by paths.
[src]
include = ["packages/extensions/basedpyright/src", "packages/extensions/mypy/src", "packages/extensions/pyrefly/src", "packages/extensions/ruff/src", "packages/extensions/ty/src", "packages/footman/src", "packages/forge/src", "packages/strongroom/src", "packages/toolroom/src", "packages/toolroom-bench/src", "packages/toolroom-store/src", "packages/workshop/src"]

[environment]
# Every platform at once (ty checks the union), 3.11 floor.
python-platform = "all"
python-version = "3.11"
# The tool stubs `fm tools.restub` writes.
extra-paths = ["typings"]

# The repository's own tables.
# -- workshop: region tables, yours to edit; the render keeps it --
# -- workshop: end tables --
