# The workspace contract, ecosystem-neutral. The workshop reads this;
# nothing else is authoritative about workspace shape.

[workspace]
# The base layer, then livery.forge's dev-container tasks. Discovery
# is this list and nothing else: a layer not named here is not
# mounted, however it got installed.
layers = ["livery.workshop", "livery.forge"]

[forge]
kind = "github"
owner = "willemkokke"

[ci]
runners = ["ubuntu-latest", "macos-latest", "windows-latest"]
