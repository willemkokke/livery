# The workspace contract, ecosystem-neutral. The workshop reads this;
# nothing else is authoritative about workspace shape.

[workspace]
# The workspace's identity: what its project file, its README and
# its licence name it by, and what a new member's name derives from.
name = "livery"
description = "The livery ecosystem monorepo (virtual root)."
namespace = "livery"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
copyright-year = "2026"
# The extensions, each by the name its distribution declares in the
# workshop.extensions entry point group, written as the canonical list:
# no extension another listed one requires, each after the ones it
# requires, ties alphabetical, which `fm check --fix` writes. The mount
# takes the extensions this list and the packages' lists name, and every
# extension those require; an extension outside that set is not
# mounted, however it got installed. The base is never listed, and a
# plugin (forge's dev verbs, the bench's tools verbs) mounts because
# this project depends on it directly.
extensions = [
    # The type checker, configured by the root pyrightconfig.json; its
    # type-completeness step is turned on under [phases] below.
    "basedpyright",
    # Each package's CHANGELOG.md, written by git-cliff at release.
    "changelog",
    # The C and C++ formatter, in each native package's .clang-format.
    "clang-format",
    # The C and C++ linter, in each native package's .clang-tidy.
    "clang-tidy",
    # CLAUDE.md, the agent's guidance, .claude/ and the hook verbs.
    "claude",
    # Each package's coverage floor, judged on the union every CI leg
    # measured, and the site's coverage pages drawn from it, in a
    # distribution of its own, livery-extensions-coverage.
    "coverage",
    # The site's python API reference, its handler's tables in the
    # site's config, and the docstring checks, in a distribution of its
    # own, livery-extensions-mkdocstrings. It requires docs, the site's
    # assembly and verbs, in a distribution of its own,
    # livery-extensions-docs, which the set takes in through it.
    "mkdocstrings",
    # The type checker on every platform, configured by the root mypy.ini.
    "mypy",
    # The type checker over every platform at once, configured by the
    # root pyrefly.toml.
    "pyrefly",
    # The test runner and its coverage meter, configured by the root
    # pytest.toml and .coveragerc.
    "pytest",
    # Each python package's build, release and layering rules, in a
    # distribution of its own, livery-extensions-python. The root's own
    # tests are python, and so is tasks.py: the root's tests hold the
    # root's set, so the python steps judge them and pytest runs them.
    "python",
    # The python formatter and linter, configured by the root ruff.toml.
    "ruff",
    # The type checker over every platform at once, configured by the
    # root ty.toml.
    "ty",
]

# The steps the listed extensions declare off, turned on here at each
# step's own address: every public API is type-complete, and the site
# documents the tasks each package advertises.
[phases.typecomplete.basedpyright]
enabled = true

[phases.docs.task-reference]
enabled = true

[docs]
# The site's home; the account-level domain serves every project.
site-url = "https://docs.willem.net/livery/"
description = "The livery ecosystem: one forge interface and the workshop that runs every project on it."

[forge]
kind = "github"
owner = "willemkokke"

[toolroom]
# The catalogue the lock and the stubs resolve against. This
# repository is the authoring site, so it reads its own records; a
# consumer names the published index's URL. The lock covers every
# host `[workspace] hosts` supports, every host key while it is absent.
index = "records"
# The Windows ARM runner is one line in `[ci] runners`,
# `runners = [..., "windows-11-arm"]`, then `fm sync`.
# Measured against x64 on one commit: the type checkers finish in half
# the time, the tests in the same, the archive restores slower, and the
# job's wall time is longer, so the gate gains nothing from it; a nightly
# on it is the case to come back to.
# What this repository's own tasks run beyond the base's and the
# extensions' tools; a tool locked here has a stub, and one that is not
# types as `Tool`.
# conan and the cmake-conan provider are here because the conan and
# nanobind extensions' own tests build a native library and an extension
# against it, and coverage because the toolroom package's tests run it
# and type its stub.
requires = [
    "git",
    "coverage",
    "zensical",
    "cmake",
    "conan",
    "cmake_conan",
    "clang_format@!windows-arm",
    "clang_tidy@!windows-arm",
    # Microsoft's coverage engine, the measurer of a cpp-conan package
    # built with MSVC, which the workshop's own tests prove on the
    # Windows leg; the .NET SDK it runs on rides as its runtime, on
    # the same hosts.
    "dotnet_coverage@windows",
]

# Who reviews the workspace's own governance. These owners guard
# this contract and the rendered codeowners file, so raising a
# reviewer count is itself a reviewed merge; each package's own
# workshop.toml declares its owners the same way.
[owners]
users = ["willemkokke"]
teams = []
approvals = 0

# What a release tests each member at before it publishes: its built
# wheel in a fresh venv at the versions uv.lock pins, the resolution
# the gate tests the tree at.
[release]
prove = ["head"]

[ci]
# Every tier-1 platform gates. The windows-latest leg is the
# slowest; `[ci] windows-temp` keeps its files on the runner's
# working drive (the gate measured at 486 s there against 576 s on
# the system temp), and the timing plan carries the rest.
runners = ["ubuntu-latest", "macos-latest", "windows-latest"]
# A pull request's check legs run on every runner above, as the merge
# point and the nightly do: the coverage union judges a package's floor
# over every platform's branches, and a row carried from main's record
# cannot stand in for a file the change moved (ruled 2026-10-12, #1499).
pull-request-runners = ["ubuntu-latest", "macos-latest", "windows-latest"]
# Each runner's check leg runs as the shards named here, one for a
# runner not named; the slowest legs split so every platform ends at
# about the same time (`fm ci.balance` proposes the counts from the
# timing record). Measured on 2026-10-17: 1, 3 and 4 shards predict
# 276 s, 296 s and 325 s against 1082 s for Windows alone.
shards = { "macos-latest" = 3, "windows-latest" = 4 }
# A pull request's check legs run the scoped gate against its base:
# the packages the change can influence run, the others' suites are
# reused from the coverage store; a push run and a change outside
# the packages pay the full gate.
affected-legs = true
# The one status name branch protection requires, spelled by contract
# so each forge's CI renders it rather than anyone retyping it.
required-context = "gate"
# Every job keeps a trace of what it did, on the traces' own refs, which
# no sync mirrors. Off is zero cost, for an installation that wants it
# only while investigating.
profile = true

# The balancer, nightly: it reads the timing rows and, when a count
# should move and the predicted wall moves by more than 10%, writes the
# counts into `[ci] shards` and `[ci] pull-request-shards` above on the
# day's branch, renders the workflows, and submits the change unarmed
# for a person to merge; a day whose branch origin already holds at
# these counts submits nothing. Once, on the first leg, before the
# refresh: it leaves the checkout where it found it, so the refresh
# submits from the default branch as before. Every nightly, since the
# cadences are weekly and the nightly is daily.
[[ci.schedule]]
point = "nightly"
task = "ci.balance"
args = ["--submit"]
once = true

# toolroom's refresh, every two weeks on the nightly point: the tools'
# new releases are observed, the stubs regenerated, and what moved is
# committed and submitted, armed when every change only added to a
# surface. Once, on the first leg: the legs observe the same releases,
# and two legs submitting one day's branch race each other's push.
[[ci.schedule]]
point = "nightly"
task = "toolroom.refresh"
args = ["--submit"]
every = "2w"
once = true

# The train's proof, nightly: the loop's release scenario on the first
# runner, from a scratch branch of main, publishing nothing; the
# release itself happens when a consumer outside this repository needs
# one (ruled 2026-10-10).
[[ci.schedule]]
point = "nightly"
task = "ci.e2e"
args = ["--scenario=release", "--from-main"]
once = true

# The reaches into another distribution's private names the python
# extension's private-reaches rule allows, each with the public seam
# that will replace it. An entry no source uses any more refuses.
[[python.private-reaches]]
from = "livery-workshop"
reaches = "livery.forge._registry.purge_gitlab_packages"
reason = "the loop deletes published versions: the forge's admin protocol, phase 15"

[[python.private-reaches]]
from = "livery-workshop"
reaches = "livery.forge._registry.purge_packages"
reason = "the loop deletes published versions: the forge's admin protocol, phase 15"
