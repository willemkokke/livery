# The workspace contract, ecosystem-neutral. The workshop reads this;
# nothing else is authoritative about workspace shape.

[workspace]
# The layers, in precedence order. Discovery is this list and nothing
# else: a layer not named here is not mounted, however it got
# installed.
layers = [
    "livery.workshop",
    "livery.forge",
    { import = "livery.toolroom.tools", dist = "livery-toolroom" },
    "livery.footman",
]
# Where the rendered files come from: a directory relative to this
# root, or a git URL (a fork, at your own risk). The update wave
# follows this value.
templates = "packages/workshop/src/livery/workshop/templates"
templates-artifact = "git@github.com:willemkokke/workshop-templates.git"

[docs]
# The site's home; the account-level domain serves every project.
site-url = "https://docs.willem.net/livery/"
description = "The livery ecosystem: one forge interface and the workshop that runs every project on it."

[forge]
kind = "github"
owner = "willemkokke"

# Who reviews the workspace's own governance. These owners guard
# this contract and the rendered codeowners file, so raising a
# reviewer count is itself a reviewed merge; each package's own
# workshop.toml declares its owners the same way.
[owners]
users = ["willemkokke"]
teams = []
approvals = 0

[ci]
# Every tier-1 platform gates. The windows-latest leg is the
# slowest; `[ci] windows-temp` keeps its files on the runner's
# working drive (the gate measured at 486 s there against 576 s on
# the system temp), and the timing plan carries the rest.
runners = ["ubuntu-latest", "macos-latest", "windows-latest"]
# A pull request's check legs run the scoped gate against its base:
# the packages the change can influence run, the others' suites are
# reused from the coverage store; a push run and a change outside
# the packages pay the full gate.
affected-legs = true
# The one status name branch protection requires, spelled by contract
# so each forge's CI renders it rather than anyone retyping it.
required-context = "gate"
