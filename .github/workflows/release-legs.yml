# The live legs, run before a release tag: the conformance suite
# against the compose forges and the three cloud accounts. Each cloud
# leg skips cleanly when its secret is absent (the skip is named in
# the run summary) and cleans its scratch at the end, whatever the
# verdict. Dispatch with `gh workflow run release-legs.yml`.
name: release-legs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitea-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned by hand to the lock's uv; the emitted workflows
          # derive the same pin from uv.lock.
          version: "0.12.7"
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Start and seed the compose Gitea
        run: coverage run -m footman forge.dev.up --profile=gitea
      - name: Conformance, live
        env:
          LIVERY_FORGE_LIVE: "1"
          # CI runners are slower than a laptop; the budget separates
          # broken from slow.
          LIVERY_FORGE_POLL_TIMEOUT: "360"
        run: coverage run -m pytest packages/forge/tests/test_gitea_conformance.py -n 4
      - name: Evidence from the scratch repositories
        if: failure()
        run: |
          python3 .github/scripts/e2e_diagnose.py gitea
          docker compose -f packages/forge/src/livery/forge/_dev/compose.yaml \
            --profile gitea --profile gitea-runner logs act_runner | tail -80
      - name: Down
        if: always()
        run: fm forge.dev.down --wipe
      - name: Leg coverage data
        if: always()
        run: coverage combine || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-legs-gitea-local
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore

  gitlab-local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned by hand to the lock's uv; the emitted workflows
          # derive the same pin from uv.lock.
          version: "0.12.7"
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Start and seed the compose GitLab (first boot takes minutes)
        run: coverage run -m footman forge.dev.up --profile=gitlab
      - name: Conformance, live
        env:
          LIVERY_FORGE_LIVE: "1"
        # One single-node GitLab absorbs about four concurrent
        # writers; beyond that Gitaly times out.
        run: coverage run -m pytest packages/forge/tests/test_gitlab_conformance.py -n 4
      - name: Evidence from the scratch repositories
        if: failure()
        run: python3 .github/scripts/e2e_diagnose.py gitlab
      - name: Down
        if: always()
        run: fm forge.dev.down --wipe
      - name: Leg coverage data
        if: always()
        run: coverage combine || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-legs-gitlab-local
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore

  github-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEG_TOKEN: ${{ secrets.LIVERY_E2E_GITHUB_TOKEN }}
    steps:
      - name: Guard
        id: guard
        run: |
          if [ -z "$LEG_TOKEN" ]; then
            echo "leg skipped: no LIVERY_E2E_GITHUB_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.present == 'true'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned by hand to the lock's uv; the emitted workflows
          # derive the same pin from uv.lock.
          version: "0.12.7"
        if: steps.guard.outputs.present == 'true'
      - name: Enter the workspace
        if: steps.guard.outputs.present == 'true'
        run: bash setup.sh github
      - name: Conformance, live against the e2e organisation
        if: steps.guard.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.LIVERY_E2E_GITHUB_TOKEN }}
          LIVERY_FORGE_E2E_OWNER: ${{ vars.LIVERY_E2E_GITHUB_OWNER }}
          LIVERY_FORGE_LIVE: "1"
        run: coverage run -m pytest packages/forge/tests/test_github_conformance.py -n 4
      - name: Clean the scratch
        if: always() && steps.guard.outputs.present == 'true'
        env:
          LEG: github
          TOKEN: ${{ secrets.LIVERY_E2E_GITHUB_TOKEN }}
          OWNER: ${{ vars.LIVERY_E2E_GITHUB_OWNER }}
        run: python3 .github/scripts/e2e_cleanup.py
      - name: Leg coverage data
        if: always() && steps.guard.outputs.present == 'true'
        run: coverage combine || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.guard.outputs.present == 'true'
        with:
          name: coverage-legs-github-cloud
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore

  gitlab-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEG_TOKEN: ${{ secrets.LIVERY_E2E_GITLAB_TOKEN }}
    steps:
      - name: Guard
        id: guard
        run: |
          if [ -z "$LEG_TOKEN" ]; then
            echo "leg skipped: no LIVERY_E2E_GITLAB_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.present == 'true'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned by hand to the lock's uv; the emitted workflows
          # derive the same pin from uv.lock.
          version: "0.12.7"
        if: steps.guard.outputs.present == 'true'
      - name: Enter the workspace
        if: steps.guard.outputs.present == 'true'
        run: bash setup.sh github
      - name: Point the harness at gitlab.com
        if: steps.guard.outputs.present == 'true'
        run: |
          printf 'GITLAB_URL=https://gitlab.com\nGITLAB_TOKEN=%s\n' "$LEG_TOKEN" > .forge.dev.env
      - name: Conformance, live against the e2e group
        if: steps.guard.outputs.present == 'true'
        env:
          LIVERY_FORGE_E2E_OWNER: ${{ vars.LIVERY_E2E_GITLAB_GROUP }}
          LIVERY_FORGE_LIVE: "1"
        run: coverage run -m pytest packages/forge/tests/test_gitlab_conformance.py -n 4
      - name: Clean the scratch
        if: always() && steps.guard.outputs.present == 'true'
        env:
          LEG: gitlab
          URL: https://gitlab.com
          TOKEN: ${{ secrets.LIVERY_E2E_GITLAB_TOKEN }}
          OWNER: ${{ vars.LIVERY_E2E_GITLAB_GROUP }}
        run: python3 .github/scripts/e2e_cleanup.py
      - name: Leg coverage data
        if: always() && steps.guard.outputs.present == 'true'
        run: coverage combine || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.guard.outputs.present == 'true'
        with:
          name: coverage-legs-gitlab-cloud
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore

  gitea-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEG_TOKEN: ${{ secrets.LIVERY_E2E_GITEA_TOKEN }}
      RUNNER_NAME: release-legs-${{ github.run_id }}
    steps:
      - name: Guard
        id: guard
        run: |
          if [ -z "$LEG_TOKEN" ]; then
            echo "leg skipped: no LIVERY_E2E_GITEA_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.present == 'true'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned by hand to the lock's uv; the emitted workflows
          # derive the same pin from uv.lock.
          version: "0.12.7"
        if: steps.guard.outputs.present == 'true'
      - name: Enter the workspace
        if: steps.guard.outputs.present == 'true'
        run: bash setup.sh github
      - name: Disposable act_runner (gitea.com grants no shared runners)
        if: steps.guard.outputs.present == 'true'
        env:
          TOKEN: ${{ secrets.LIVERY_E2E_GITEA_TOKEN }}
          OWNER: ${{ vars.LIVERY_E2E_GITEA_OWNER }}
          URL: https://gitea.com
        run: |
          reg=$(python3 .github/scripts/e2e_gitea_runner.py mint)
          # Held conformance runs occupy a slot each until released or
          # cancelled, so one-job capacity would deadlock the suite.
          printf 'runner:\n  capacity: 8\n' > "$PWD/runner-config.yaml"
          docker run -d --name legs-runner \
            -v "$PWD/runner-config.yaml:/runner-config.yaml:ro" \
            -e CONFIG_FILE=/runner-config.yaml \
            -e GITEA_INSTANCE_URL=https://gitea.com \
            -e GITEA_RUNNER_REGISTRATION_TOKEN="$reg" \
            -e GITEA_RUNNER_NAME="$RUNNER_NAME" \
            -e GITEA_RUNNER_LABELS=ubuntu-latest:host \
            docker.gitea.com/act_runner:latest
      - name: Point the harness at gitea.com
        if: steps.guard.outputs.present == 'true'
        run: |
          printf 'GITEA_URL=https://gitea.com\nGITEA_TOKEN=%s\n' "$LEG_TOKEN" > .forge.dev.env
      - name: Conformance, live against the e2e organisation
        if: steps.guard.outputs.present == 'true'
        env:
          LIVERY_FORGE_E2E_OWNER: ${{ vars.LIVERY_E2E_GITEA_OWNER }}
          LIVERY_FORGE_LIVE: "1"
        run: coverage run -m pytest packages/forge/tests/test_gitea_conformance.py -n 4
      - name: Remove the runner
        if: always() && steps.guard.outputs.present == 'true'
        env:
          TOKEN: ${{ secrets.LIVERY_E2E_GITEA_TOKEN }}
          OWNER: ${{ vars.LIVERY_E2E_GITEA_OWNER }}
          URL: https://gitea.com
        run: |
          docker rm -f legs-runner || true
          python3 .github/scripts/e2e_gitea_runner.py remove
      - name: Clean the scratch
        if: always() && steps.guard.outputs.present == 'true'
        env:
          LEG: gitea
          URL: https://gitea.com
          TOKEN: ${{ secrets.LIVERY_E2E_GITEA_TOKEN }}
          OWNER: ${{ vars.LIVERY_E2E_GITEA_OWNER }}
        run: python3 .github/scripts/e2e_cleanup.py
      - name: Leg coverage data
        if: always() && steps.guard.outputs.present == 'true'
        run: coverage combine || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.guard.outputs.present == 'true'
        with:
          name: coverage-legs-gitea-cloud
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore

  # The honest union, per release: every leg's live coverage merged
  # into one informational report. Never a gate; the deterministic
  # floors live in the PR gate's own hermetic run.
  coverage-report:
    if: always()
    needs: [gitea-local, gitlab-local, github-cloud, gitlab-cloud, gitea-cloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinned by hand to the lock's uv; the emitted workflows
          # derive the same pin from uv.lock.
          version: "0.12.7"
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Merge every leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-legs-*
          path: coverage-data
      - name: Report the union
        run: |
          shopt -s nullglob
          files=(coverage-data/*/.coverage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no coverage data reached the report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          coverage combine "${files[@]}"
          echo '## Live coverage union' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report --sort=cover >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
