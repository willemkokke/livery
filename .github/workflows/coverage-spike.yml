# Generated by the workshop from workshop.toml; the gate keeps
# it matching. Edit the contract (or the emitters) and run
# `fm template.apply`; an edit here is drift.
name: coverage-spike

# The coverage-spike point, contributed by packages/workshop: the clock
# and a dispatch entry, one call per runner and Python it names, with the
# job token and nothing more.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  coverage-spike:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/footman/toolroom
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Enter the workspace
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: bash setup.sh github
      - name: Coverage-spike
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          fm ci.run --point=coverage-spike --job=coverage-spike
          --os="${{ matrix.os }}" --python="${{ matrix.python }}"
