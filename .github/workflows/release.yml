# Generated by the workshop from workshop.toml; the gate keeps
# it matching. Edit the contract (or the emitters) and run
# `fm template.apply`; an edit here is drift.
name: release

# The train: a workflow.release PR merges, this publishes its squash, and
# the receipt tags are cut only after the index confirms each member. A
# tag is a receipt, never a trigger: the merge point's dispatch job starts
# the wave at the release squash, and a hand dispatch with --ref is the
# recovery entry when a publish died mid-wave; --workshop names a released
# driver for a wave whose own workshop was the fault.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: the release squash to publish
        required: true
      workshop:
        description: a released livery-workshop version to drive the wave; empty runs the squash's own
        required: false
        default: ""

jobs:
  # The wave: publish the ref, cut the receipt tags after the index
  # confirms each member. The receipt push carries the repository's token
  # where there is one: the job token may not push a ref whose commit
  # carries a workflow file that differs from the tip's.
  publish:
    permissions:
      id-token: write
      contents: write
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.FORGE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: packages
          merge-multiple: true
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Pin the driver
        run: fm release.driver --workshop="${{ inputs.workshop }}"
      - name: Publish the wave
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN || secrets.GITHUB_TOKEN }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: fm ci.run --point=release --job=publish
  # The home's release aftermath: the (composed) template artifact, tagged
  # in lockstep with the publishing layer's receipt.
  templates:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.FORGE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Pin the driver
        run: fm release.driver --workshop="${{ inputs.workshop }}"
      - name: Deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.WORKSHOP_TEMPLATES_DEPLOY_KEY }}" > ~/.ssh/templates_deploy
          chmod 600 ~/.ssh/templates_deploy
      - name: Publish the template artifact
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/templates_deploy -o StrictHostKeyChecking=accept-new
        run: fm ci.run --point=release --job=templates
