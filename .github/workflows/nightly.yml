# Generated by the workshop from workshop.toml; the gate keeps
# it matching. Edit the contract (or the emitters) and run
# `fm template.apply`; an edit here is drift.
name: nightly

# The nightly point: the clock and a manual trigger, one
# `fm ci.run` per python. What the point runs is data, the
# workshop's builtin schedule plus [[ci.schedule]] in workshop.toml,
# and the tests that declare the nightly point are selected in.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A replay checks the tree out at a release tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          # One cache identity per leg: a shared key makes
          # every leg but the first fail its save with a
          # reservation warning.
          cache-suffix: nightly-${{ matrix.python }}
      - name: Enter the workspace
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: bash setup.sh github
      - name: Nightly
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          fm ci.run --point=nightly --job=nightly
          --python="${{ matrix.python }}"
