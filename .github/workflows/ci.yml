# Generated by the workshop from workshop.toml; the gate keeps
# it matching. Edit the contract (or the emitters) and run
# `fm template.apply`; an edit here is drift.
name: ci

# A pull request, a push to main, and a dispatch by hand. A dispatched run
# pays the full gate: the check verb reads the event and narrows on a pull
# request alone, so every event spells the same call.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The check legs: the tests run metered, and only they. The leg's
  # measured suites ride its per-run ref on the state store, and the gate
  # job unions them with main's record and judges once. The scoped gate
  # diffs against the merge base with the pull request's base branch,
  # which a shallow clone lacks.
  check:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          # One cache identity per leg: a shared key makes
          # every leg but the first fail its save with a
          # reservation warning.
          cache-suffix: ${{ matrix.os }}-${{ matrix.python }}
      - name: Enter the workspace
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: bash setup.sh github
      - name: Check
        run: >-
          fm ci.run --point=gate --job=check
          --os="${{ matrix.os }}" --python="${{ matrix.python }}"
      # The run as a Chrome trace, one artifact per leg. Observational,
      # so it runs on a red gate too and its own exit never decides
      # the leg.
      - name: Upload the run profile
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-${{ matrix.os }}-${{ matrix.python }}
          path: fm-profile.json
          if-no-files-found: ignore
  # The strict site build: broken links and orphan pages go red here,
  # required through the gate context, never inside the local check.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          # One cache identity per leg: a shared key makes
          # every leg but the first fail its save with a
          # reservation warning.
          cache-suffix: docs
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Docs
        run: fm ci.run --point=gate --job=docs
  # The one required context. Branch protection points here, so the matrix
  # can grow or shrink without touching repository settings. Its entries
  # union the legs' measured suites with main's coverage record and judge
  # the floors, collect the run's timing rows, ask the forge for the jobs
  # it needs, and stamp the tree a green run proved; a red run is judged
  # too. The stamp composes a narrowed run with its base tree's record
  # through the merge base, which a shallow clone lacks.
  gate:
    if: always()
    needs: [check, docs]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Verdict
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fm ci.run --point=gate --job=gate
  # The site's deploy through the contract's seam, on the push alone. The
  # release view reads the receipt tags; a shallow tagless clone renders
  # its no-tags fallback page instead.
  deploy:
    if: github.event_name == 'push'
    needs: [gate]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          # One cache identity per leg: a shared key makes
          # every leg but the first fail its save with a
          # reservation warning.
          cache-suffix: docs
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Deploy
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fm ci.run --point=merge --job=deploy
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
  # The repository settings reconciled when the merge changed a contract
  # or the owners file. The commit's own file list decides whether
  # anything is governed; a depth of one would read a squash as a root.
  govern:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Govern
        env:
          FORGE_ADMIN_TOKEN: ${{ secrets.FORGE_ADMIN_TOKEN }}
        run: fm ci.run --point=merge --job=govern
  # The release wave is dispatched from here, after main's own verdict:
  # the verb reads the manifest at HEAD and the receipts on the remote,
  # and is green unless a merged release is unpublished. The commit that
  # stamped the manifest can be far back.
  dispatch:
    if: github.event_name == 'push'
    needs: [gate]
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Enter the workspace
        run: bash setup.sh github
      - name: Dispatch
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fm ci.run --point=merge --job=dispatch
