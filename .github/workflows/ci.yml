name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Sync (locked)
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Gate
        run: uv run --no-sync fm check

  # The one required context. Branch protection points here, so the
  # matrix can grow or shrink without touching repository settings.
  gate:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: test "${{ needs.check.result }}" = "success"
